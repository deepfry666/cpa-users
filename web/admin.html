<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户分发</title>
<style>
:root {
  color-scheme: light;
  /* Fallbacks match CPAMC's default theme; embedded pages copy live values from the parent. */
  --bg-secondary: #faf9f5; --bg-primary: #f2f0ea; --bg-tertiary: #e7e4dc; --bg-quinary: #f6f4ee;
  --text-primary: #22201d; --text-secondary: #625d56; --text-tertiary: #928c84;
  --border-color: #e2dfd7; --border-primary: #d2cec4;
  --primary-color: #2563eb; --primary-hover: #1d4ed8; --primary-contrast: #ffffff;
  --accent: #2563eb; --accent-soft: rgba(37, 99, 235, 0.10);
  --success-color: #16a34a; --error-color: #c65746; --warning-bg: rgba(198, 87, 70, 0.11);
  --budget-ok: #16a34a; --budget-warn: #d97706; --budget-bad: #dc2626;
  --warn-text: #92400e; --warn-surface: rgba(217, 119, 6, 0.11); --warn-border: rgba(217, 119, 6, 0.32);
  --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.06); --shadow-lg: 0 12px 24px -6px rgb(0 0 0 / 0.14);
  --radius-md: 8px;
  --series-1: #2563eb; --series-2: #0d9488; --series-3: #d97706; --series-4: #7c3aed;
  --series-5: #db2777; --series-6: #4f46e5; --series-7: #0284c7; --series-other: #94a3b8;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"]):not([data-theme="white"]):not([data-host="cpamc"]):not([data-host="frame"])) {
    color-scheme: dark;
    --bg-secondary: #141311; --bg-primary: #1c1a17; --bg-tertiary: #26231f; --bg-quinary: #181715;
    --text-primary: #f3f1ed; --text-secondary: #bcb6ae; --text-tertiary: #878179;
    --border-color: #2d2925; --border-primary: #3a352f;
    --primary-color: #5b93f8; --primary-hover: #74a4fa; --primary-contrast: #101216;
    --accent: #5b93f8; --accent-soft: rgba(91, 147, 248, 0.14);
    --budget-ok: #22c55e; --budget-warn: #f59e0b; --budget-bad: #ef4444;
    --warn-text: #fbbf24; --warn-surface: rgba(245, 158, 11, 0.14); --warn-border: rgba(245, 158, 11, 0.36);
    --series-1: #5b93f8; --series-2: #2dd4bf; --series-3: #f59e0b; --series-4: #a78bfa;
    --series-5: #f472b6; --series-6: #818cf8; --series-7: #38bdf8; --series-other: #6e6962;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-secondary: #141311; --bg-primary: #1c1a17; --bg-tertiary: #26231f; --bg-quinary: #181715;
  --text-primary: #f3f1ed; --text-secondary: #bcb6ae; --text-tertiary: #878179;
  --border-color: #2d2925; --border-primary: #3a352f;
  --primary-color: #5b93f8; --primary-hover: #74a4fa; --primary-contrast: #101216;
  --accent: #5b93f8; --accent-soft: rgba(91, 147, 248, 0.14);
  --budget-ok: #22c55e; --budget-warn: #f59e0b; --budget-bad: #ef4444;
  --warn-text: #fbbf24; --warn-surface: rgba(245, 158, 11, 0.14); --warn-border: rgba(245, 158, 11, 0.36);
  --series-1: #5b93f8; --series-2: #2dd4bf; --series-3: #f59e0b; --series-4: #a78bfa;
  --series-5: #f472b6; --series-6: #818cf8; --series-7: #38bdf8; --series-other: #6e6962;
}
/* Oh My CPA frames plugin pages with only a light/dark flag, so the page carries OMC's palette. */
:root[data-host="frame"] {
  --bg-secondary: #ffffff; --bg-primary: #f5f5f7; --bg-tertiary: #e8e8ed; --bg-quinary: #f9f9fb;
  --text-primary: #18181b; --text-secondary: #52525b; --text-tertiary: #71717a;
  --border-color: #e4e4e7; --border-primary: #d4d4d8; --radius-md: 6px;
}
:root[data-host="frame"][data-theme="dark"] {
  --bg-secondary: #111113; --bg-primary: #1a1a1d; --bg-tertiary: #252529; --bg-quinary: #161619;
  --text-primary: #f4f4f6; --text-secondary: #a1a1aa; --text-tertiary: #7c7c86;
  --border-color: #2a2a2f; --border-primary: #393940;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: clip; }
body {
  background: var(--bg-secondary);
  color: var(--text-primary);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.wrap { max-width: 1320px; margin: 0 auto; padding: 18px 20px 52px; }
header.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
header.top h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.ver { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
/* CPAMC floats its own toolbar over the top-right corner of plugin pages. */
:root[data-host="cpamc"] header.top { padding-right: 170px; min-height: 44px; }
@media (max-width: 640px) { :root[data-host="cpamc"] header.top { padding-right: 0; padding-top: 44px; } }

.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.spacer { flex: 1; min-width: 8px; }
.nowrap { white-space: nowrap; }
.mono, code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
.tnum { font-variant-numeric: tabular-nums; }

.warn-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: var(--warn-surface); border: 1px solid var(--warn-border);
  color: var(--warn-text); font-size: 12.5px; font-weight: 500;
  cursor: pointer; white-space: nowrap;
}
.warn-pill:hover { filter: brightness(0.96); }
.warn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--budget-warn); flex-shrink: 0; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-color); margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; border: 0; background: none; padding: 9px 14px; cursor: pointer;
  color: var(--text-secondary); border-bottom: 2px solid transparent; margin-bottom: -1px;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 14px;
}
.tab:hover { color: var(--text-primary); }
.tab[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }
.tab-badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--warn-surface); color: var(--warn-text); border: 1px solid var(--warn-border);
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border-primary); background: var(--bg-primary);
  border-radius: var(--radius-md); padding: 6px 12px; cursor: pointer;
  white-space: nowrap; font-size: 13.5px; line-height: 1.3;
  transition: background-color .12s, border-color .12s, opacity .12s;
}
.btn:hover:not(:disabled) { background: var(--bg-tertiary); }
.btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { opacity: 0.92; background: var(--accent); }
.btn.danger { color: var(--budget-bad); }
.btn.danger:hover:not(:disabled) { background: var(--warning-bg); border-color: var(--budget-bad); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-secondary); }
.btn.ghost:hover:not(:disabled) { background: var(--bg-tertiary); color: var(--text-primary); }
.btn:disabled { opacity: 0.45; cursor: default; }

.card {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
}
.card + .card { margin-top: 14px; }
.card-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin: 0 0 12px;
}
.card-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
.card-sub { font-size: 12.5px; color: var(--text-tertiary); font-weight: 400; }

.kpis {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
@media (max-width: 1040px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 13px 15px;
  min-width: 0;
}
.kpi-label {
  display: flex; align-items: center; gap: 6px;
  color: var(--text-secondary); font-size: 12.5px; white-space: nowrap;
}
.kpi-value {
  font-size: 24px; font-weight: 650; margin-top: 4px;
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap;
}
.kpi-value .denom { font-size: 14px; font-weight: 400; color: var(--text-tertiary); }
.kpi-sub { color: var(--text-tertiary); font-size: 12px; margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.live-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-tertiary); flex-shrink: 0; opacity: 0.45;
}
.live-dot.active {
  background: var(--budget-ok); opacity: 1;
  box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.55);
  animation: pulse-live 1.8s ease-out infinite;
}
@keyframes pulse-live {
  0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.55); }
  70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
  100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
}

.table-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
th { color: var(--text-secondary); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text-primary); }
th .sort-ind { display: inline-block; margin-left: 3px; font-size: 11px; color: var(--accent); }
td.num, th.num { text-align: right; white-space: nowrap; }
td.mono { white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.sub-err td { border-bottom: 1px solid var(--border-color); padding-top: 0; padding-bottom: 9px; }
tbody tr.has-err td { border-bottom: 0; }
.err-box {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px; color: var(--budget-bad);
  background: var(--warning-bg); border-radius: 6px; padding: 5px 8px;
  word-break: break-word; white-space: pre-wrap; max-width: 100%;
}

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  background: var(--bg-tertiary); font-size: 12px;
  margin: 2px 4px 2px 0; white-space: nowrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}
.chip.src { font-size: 11px; padding: 1px 6px; margin-left: 6px; vertical-align: middle; }
.chip.src.auto { color: var(--text-secondary); }
.sync-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 12px; margin-bottom: 12px;
  border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--text-secondary); }
.sync-bar strong { color: var(--text-primary); font-weight: 600; }
.sync-bar .err { color: var(--danger, #c0392b); }
.chip.warn { background: var(--warn-surface); color: var(--warn-text); border: 1px solid var(--warn-border); }
.chip button { border: 0; background: none; padding: 0 0 0 3px; cursor: pointer; color: var(--text-tertiary); font-size: 13px; line-height: 1; }
.chip button:hover { color: var(--text-primary); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--budget-ok); flex-shrink: 0; }
.status.off::before { background: var(--text-tertiary); }
.status.bad::before { background: var(--budget-bad); }

.live-cell { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.live-cell .running-num { font-weight: 600; }
.live-cell .running-num.active { color: var(--budget-ok); }

.meter { display: grid; gap: 3px; min-width: 138px; }
.meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; white-space: nowrap; font-size: 13px; }
.meter-spent { font-weight: 600; }
.meter-limit { color: var(--text-tertiary); font-size: 12px; }
.meter .bar { height: 5px; border-radius: 99px; background: var(--bg-tertiary); overflow: hidden; }
.meter .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .2s ease; }
.meter .bar > span.ok { background: var(--budget-ok); }
.meter .bar > span.warn { background: var(--budget-warn); }
.meter .bar > span.bad { background: var(--budget-bad); }
.meter-sub { color: var(--text-tertiary); font-size: 11.5px; white-space: nowrap; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--border-primary); border-radius: var(--radius-md); overflow: hidden; background: var(--bg-secondary); }
.seg button { border: 0; background: transparent; padding: 4px 10px; cursor: pointer; color: var(--text-secondary); font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--border-color); }
.seg button[aria-pressed="true"] { background: var(--bg-tertiary); color: var(--text-primary); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-secondary); margin-bottom: 8px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 230px; overflow: visible; }
.chart .grid { stroke: var(--border-color); stroke-width: 1; }
.chart .axis { fill: var(--text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }

.tip {
  position: fixed; pointer-events: none;
  background: var(--bg-secondary); border: 1px solid var(--border-primary);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: var(--shadow-lg); white-space: nowrap; z-index: 60; display: none;
  font-variant-numeric: tabular-nums;
}
.tip-head { color: var(--text-secondary); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 6px; justify-content: space-between; margin-top: 2px; }
.tip-label { display: inline-flex; align-items: center; gap: 5px; }

.empty { padding: 30px 12px; text-align: center; color: var(--text-secondary); display: grid; gap: 10px; justify-items: center; }
.notice { padding: 10px 12px; border-radius: 8px; background: var(--warning-bg); color: var(--text-primary); margin-bottom: 14px; font-size: 13px; }
.notice.warn-box { background: var(--warn-surface); border: 1px solid var(--warn-border); }
.hint { font-size: 12px; color: var(--text-tertiary); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
@media (max-width: 680px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

label.field { display: grid; gap: 4px; font-size: 13px; color: var(--text-secondary); }
label.field input, label.field select, label.field textarea, .input {
  padding: 7px 10px; border: 1px solid var(--border-primary);
  border-radius: var(--radius-md); background: var(--bg-secondary);
  color: var(--text-primary); min-width: 0; width: 100%;
}
.input.auto-w { width: auto; }
label.field input:focus, label.field select:focus, .input:focus {
  outline: 2px solid var(--accent-soft); border-color: var(--accent);
}
.prefix-input {
  display: flex; align-items: center;
  border: 1px solid var(--border-primary); border-radius: var(--radius-md);
  background: var(--bg-secondary); overflow: hidden;
}
.prefix-input:focus-within { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.prefix-input .prefix {
  padding: 0 8px 0 10px; color: var(--text-tertiary); font-size: 13px;
  user-select: none; flex-shrink: 0;
}
.prefix-input input {
  border: 0 !important; outline: none !important; background: transparent !important;
  padding: 7px 10px 7px 2px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums;
}

label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; user-select: none; }

.form-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-color); }
.form-section-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
details.adv { margin-top: 14px; border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-quinary); }
details.adv summary {
  padding: 9px 12px; cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); user-select: none; list-style: none;
  display: flex; align-items: center; justify-content: space-between;
}
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::after { content: "展开"; font-size: 12px; color: var(--text-tertiary); }
details.adv[open] summary::after { content: "收起"; }
details.adv .adv-body { padding: 4px 12px 12px; }

dialog {
  border: 1px solid var(--border-primary); border-radius: 14px; padding: 0;
  background: var(--bg-secondary); color: var(--text-primary);
  width: min(740px, calc(100vw - 24px)); max-height: calc(100% - 32px);
  box-shadow: var(--shadow-lg);
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgb(0 0 0 / 0.4); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
.dlg-head h3 { margin: 0; font-size: 16px; font-weight: 600; }
.dlg-body { padding: 16px 18px; overflow: auto; flex: 1; min-height: 0; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border-color); flex-shrink: 0; }

.picker { border: 1px solid var(--border-primary); border-radius: 10px; overflow: hidden; }
.picker .picker-top { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border-color); background: var(--bg-primary); flex-wrap: wrap; }
.picker .picker-top input { flex: 1; min-width: 140px; }
.picker .list { max-height: 200px; overflow: auto; padding: 6px 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 2px 10px; }
.picker .list label { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 2px; cursor: pointer; overflow: hidden; }
.picker .list label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
.picker .selected { padding: 8px; border-top: 1px solid var(--border-color); min-height: 36px; }

.keybox { padding: 12px; border-radius: 10px; border: 1px dashed var(--accent); background: var(--accent-soft); margin: 0 0 12px; }
.keybox .mono { word-break: break-all; font-size: 13.5px; font-weight: 600; }

.price-add-bar {
  display: grid;
  grid-template-columns: minmax(160px, 1.5fr) repeat(4, minmax(84px, 0.8fr)) minmax(110px, 1fr) auto;
  gap: 8px; align-items: end;
  padding: 12px; border-radius: 10px;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  margin-bottom: 14px;
}
@media (max-width: 860px) {
  .price-add-bar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .price-add-bar .span-full { grid-column: 1 / -1; }
}
.price-table input.cell-in {
  padding: 5px 8px; border: 1px solid transparent; border-radius: 6px;
  background: transparent; color: var(--text-primary); width: 100%; min-width: 72px;
  font-variant-numeric: tabular-nums;
}
.price-table input.cell-in.model-in { min-width: 150px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
.price-table input.cell-in.num-in { text-align: right; min-width: 74px; }
.price-table input.cell-in.note-in { min-width: 100px; }
.price-table input.cell-in:hover { border-color: var(--border-primary); background: var(--bg-secondary); }
.price-table input.cell-in:focus { border-color: var(--accent); background: var(--bg-secondary); outline: none; }
.price-table tr.dirty { background: var(--accent-soft); }

.unpriced-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.unpriced-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 4px 3px 9px; border-radius: 8px;
  background: var(--bg-secondary); border: 1px solid var(--warn-border);
  font-size: 12.5px;
}

.login { max-width: 420px; margin: 56px auto; }
.toast {
  position: fixed; right: 16px; bottom: 16px;
  background: var(--text-primary); color: var(--bg-secondary);
  padding: 9px 14px; border-radius: 10px; box-shadow: var(--shadow-lg);
  z-index: 80; display: none; max-width: min(420px, 85vw); font-size: 13.5px;
}
.toast.err { background: var(--budget-bad); color: #ffffff; }

.name-cell { display: grid; gap: 1px; }
.name-cell .name-line { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.name-cell small { color: var(--text-tertiary); font-size: 12px; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }

@media (max-width: 640px) {
  .wrap { padding: 14px 12px 44px; }
  .kpi { padding: 11px 12px; }
  .kpi-value { font-size: 20px; }
  .card { padding: 13px; }
  th, td { padding: 7px 8px; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty">加载中…</div>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<dialog id="dlg">
  <div class="dlg-head">
    <h3 id="dlg-title"></h3>
    <button class="btn small ghost" type="button" data-close aria-label="关闭">关闭</button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
  <div class="dlg-foot" id="dlg-foot"></div>
</dialog>

<script>
(() => {
"use strict";

const PLUGIN = "cpa-users";
const MGMT = `/v0/management/${PLUGIN}/`;
// Built from pieces: Oh My CPA re-bases literal CPA paths onto its own host, but
// this link must point at CPA's public address, where users actually are.
const ME_PATH = ["", "v0", "resource", "plugins", PLUGIN, "me"].join("/");
const SESSION_KEY = `${PLUGIN}:mgmt-key`;

const fmtCompact = new Intl.NumberFormat("zh-CN", { notation: "compact", maximumFractionDigits: 1 });
const fmtInt = new Intl.NumberFormat("zh-CN");
const $ = (sel, root = document) => root.querySelector(sel);

// ---------- safe DOM helpers (never innerHTML with data) ----------
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  let deferredValue;
  if (props) {
    if ("type" in props && props.type !== undefined) el.setAttribute("type", String(props.type));
    for (const [k, v] of Object.entries(props)) {
      if (k === "type" || v === undefined || v === null || v === false) continue;
      if (k === "class" || k === "className") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k === "dataset" && typeof v === "object") {
        for (const [dk, dv] of Object.entries(v)) {
          if (dv !== undefined && dv !== null) el.dataset[dk] = String(dv);
        }
      } else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "value" && (tag === "input" || tag === "select" || tag === "textarea")) deferredValue = v;
      else if (k === "checked" || k === "disabled" || k === "selected" || k === "required" || k === "open") el[k] = Boolean(v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  const append = (c) => {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) { for (const x of c) append(x); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  append(children);
  if (deferredValue !== undefined) el.value = String(deferredValue);
  return el;
}

const SVG_NS = "http://www.w3.org/2000/svg";
function setChildren(el, ...nodes) {
  const flat = [];
  const push = (c) => {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) { for (const x of c) push(x); return; }
    flat.push(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  push(nodes);
  el.replaceChildren(...flat);
}

function svgEl(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      el.setAttribute(k, String(v));
    }
  }
  const append = (c) => {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) { for (const x of c) append(x); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  append(children);
  return el;
}

// ---------- formatting ----------
const currencySymbol = () => (state.config && state.config.currency_symbol) || "$";
const num = (n) => fmtCompact.format(Number(n) || 0);

function fmtMoney(v, sym = currencySymbol()) {
  const n = Number(v) || 0;
  if (n === 0) return `${sym}0.00`;
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1) return `${sign}${sym}${abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  return `${sign}${sym}${abs.toFixed(4)}`;
}

function fmtCostLimit(limit) {
  const n = Number(limit) || 0;
  return n > 0 ? fmtMoney(n) : "—";
}

function fmtAxisCost(v) {
  const sym = currencySymbol();
  if (!v) return `${sym}0`;
  if (v >= 1000) return `${sym}${fmtCompact.format(v)}`;
  if (v >= 1) return `${sym}${Number.isInteger(v) ? v : v.toFixed(v < 10 ? 2 : 1)}`;
  // Ticks are round steps, so three significant digits keep neighbours distinct.
  return `${sym}${parseFloat(v.toPrecision(3))}`;
}

function budgetClass(pct) {
  if (pct > 90) return "bad";
  if (pct >= 70) return "warn";
  return "ok";
}

const cpaBase = () => (state.config && state.config.public_base_url) || (document.documentElement.dataset.host === "frame" ? "" : location.origin);
const meURL = () => (cpaBase() ? cpaBase() + ME_PATH : "");

// ---------- theme: follow host panel (CPAMC / OMC) + prefers-color-scheme ----------
const THEME_VARS = [
  "--bg-primary", "--bg-secondary", "--bg-tertiary", "--bg-quinary",
  "--text-primary", "--text-secondary", "--text-tertiary",
  "--border-color", "--border-primary",
  "--primary-color", "--primary-hover", "--primary-contrast",
  "--success-color", "--error-color", "--warning-bg",
  "--shadow", "--shadow-lg", "--radius-md"
];

function parentDoc() {
  try { if (window.parent !== window && window.parent.document) return window.parent.document; } catch { /* cross-origin */ }
  return null;
}

function syncTheme() {
  const pdoc = parentDoc();
  const root = document.documentElement;
  if (!pdoc) { root.dataset.host = "standalone"; return; }
  const cs = getComputedStyle(pdoc.documentElement);
  // CPAMC defines its design tokens on its root; OMC's frame shell only sets data-theme.
  const isCpamc = cs.getPropertyValue("--bg-primary").trim() !== "";
  root.dataset.host = isCpamc ? "cpamc" : "frame";
  for (const v of THEME_VARS) {
    const val = isCpamc ? cs.getPropertyValue(v).trim() : "";
    if (val) root.style.setProperty(v, val); else root.style.removeProperty(v);
  }
  const theme = pdoc.documentElement.getAttribute("data-theme");
  root.setAttribute("data-theme", theme || "light");
  if (pdoc.documentElement.lang) root.lang = pdoc.documentElement.lang;
  if (state.loaded && view.tab === "overview") renderChart();
}

const pdocInit = parentDoc();
if (pdocInit) {
  new MutationObserver(syncTheme).observe(pdocInit.documentElement, {
    attributes: true, attributeFilter: ["data-theme", "class", "style", "lang"]
  });
}

// ---------- management key: reuse CPAMC remembered login or session ----------
function readCpamcKey() {
  try {
    const raw = localStorage.getItem("cli-proxy-auth");
    if (!raw || !raw.startsWith("enc::v2::")) return "";
    const salt = new TextEncoder().encode(`cli-proxy-api-webui::secure-storage|${location.host}`);
    const bin = atob(raw.slice("enc::v2::".length));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ salt[i % salt.length];
    const data = JSON.parse(new TextDecoder().decode(bytes));
    return (data && data.state && data.state.managementKey) || "";
  } catch { return ""; }
}
function readSessionKey() { try { return sessionStorage.getItem(SESSION_KEY) || ""; } catch { return ""; } }
function writeSessionKey(v) { try { v ? sessionStorage.setItem(SESSION_KEY, v) : sessionStorage.removeItem(SESSION_KEY); } catch { /* ignore */ } }
let mgmtKey = readSessionKey() || readCpamcKey();

// ---------- API client ----------
class AuthError extends Error {}
async function api(path, { method = "GET", body, query, timeoutMs } = {}) {
  const url = new URL(MGMT + path, location.origin);
  if (query) {
    for (const [k, v] of Object.entries(query)) {
      if (v !== undefined && v !== "" && v !== null) url.searchParams.set(k, v);
    }
  }
  const res = await fetch(url, {
    method,
    cache: "no-store",
    // No key means no header at all: Oh My CPA then supplies its stored management key,
    // while an explicit (even empty) credential would be checked and refused.
    headers: {
      ...(mgmtKey ? { Authorization: `Bearer ${mgmtKey}` } : {}),
      ...(body !== undefined ? { "Content-Type": "application/json" } : {})
    },
    body: body !== undefined ? JSON.stringify(body) : undefined,
    signal: timeoutMs && typeof AbortSignal !== "undefined" && AbortSignal.timeout ? AbortSignal.timeout(timeoutMs) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch { /* non-json */ }
  if (res.status === 401) throw new AuthError(data.error || "管理密钥无效");
  if (res.status === 403 && !data.error) throw new AuthError("远程管理未开启（remote-management.allow-remote）或密钥无权限");
  if (!res.ok) throw new Error(data.error || data.message || `请求失败（${res.status}）`);
  return data;
}

// ---------- state ----------
const state = {
  loaded: false,
  groups: [],
  users: [],
  keys: [],
  models: [],
  prices: [],
  unpriced_models: [],
  running_total: 0,
  config: {},
  usage: null,
  logs: [],
  error: "",
  timezone: "",
  version: "",
  liveByUser: new Map(), // id -> { running, max, rpm, rpm_limit, oldest_started_at }
};

const view = {
  tab: "overview",
  days: 7,
  metric: "cost",
  sortKey: "day_cost",
  sortDir: -1, // -1 desc, 1 asc
  logUser: "",
  logFailed: false,
  prefillPriceModel: "",
};

const userColor = new Map();

function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast" + (isErr ? " err" : "");
  t.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.style.display = "none"; }, isErr ? 5000 : 2400);
}

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(msg || "已复制");
  } catch {
    prompt("复制下面的内容", text);
  }
}

function qOf(u) {
  const q = (u && u.quota) || {};
  const live = u ? state.liveByUser.get(u.id) : null;
  return {
    day: { tokens: q.day?.tokens || 0, requests: q.day?.requests || 0, cost: Number(q.day?.cost) || 0 },
    month: { tokens: q.month?.tokens || 0, requests: q.month?.requests || 0, cost: Number(q.month?.cost) || 0 },
    total_cost: Number(q.total_cost) || 0,
    running: live ? (live.running || 0) : (q.running || 0),
    rpm: live ? (live.rpm || 0) : (q.rpm || 0),
    oldest_started_at: live ? (live.oldest_started_at || 0) : (q.oldest_started_at || 0),
    day_reset: q.day_reset || 0,
    month_reset: q.month_reset || 0,
  };
}

async function loadState() {
  const s = await api("state");
  const users = s.users || [];
  const runningSum = users.reduce((a, u) => a + (u.quota?.running || 0), 0);
  Object.assign(state, {
    groups: s.groups || [],
    users,
    keys: s.keys || [],
    models: s.models || [],
    prices: s.prices || [],
    unpriced_models: s.unpriced_models || [],
    price_sync: s.price_sync || null,
    running_total: typeof s.running_total === "number" ? s.running_total : runningSum,
    config: s.config || {},
    ready: s.ready,
    error: s.error || "",
    timezone: s.timezone || "",
    version: s.version || "",
    loaded: true,
  });
  state.liveByUser.clear();
  for (const u of users) {
    state.liveByUser.set(u.id, {
      running: u.quota?.running || 0,
      max: u.max_concurrency || 0,
      rpm: u.quota?.rpm || 0,
      rpm_limit: u.rpm_limit || 0,
      oldest_started_at: u.quota?.oldest_started_at || 0,
    });
  }
  userColor.clear();
  state.users.forEach((u, i) => userColor.set(u.id, i < 7 ? `var(--series-${i + 1})` : "var(--series-other)"));
}

async function loadUsage() {
  state.usage = await api("usage", { query: { days: view.days } });
}

async function loadLogs() {
  const r = await api("logs", { query: { limit: 300, user_id: view.logUser, failed: view.logFailed ? "1" : "" } });
  state.logs = r.logs || [];
}

async function refresh() {
  try {
    await loadState();
    if (view.tab === "overview") await loadUsage();
    if (view.tab === "logs") await loadLogs();
    render();
    scheduleLive();
  } catch (e) { handleError(e); }
}

function handleError(e) {
  if (e instanceof AuthError) {
    stopLive();
    state.loaded = false;
    writeSessionKey("");
    mgmtKey = "";
    renderLogin(e.message);
    return;
  }
  toast(e.message || String(e), true);
}

// ---------- live polling (every 3s while visible, in-place DOM updates) ----------
let liveTimer = null;
let liveInFlight = false;

function stopLive() {
  if (liveTimer) { clearTimeout(liveTimer); liveTimer = null; }
}

function scheduleLive(delayMs = 3000) {
  stopLive();
  if (!state.loaded || document.visibilityState !== "visible") return;
  liveTimer = setTimeout(pollLive, delayMs);
}

async function pollLive() {
  liveTimer = null;
  if (!state.loaded || document.visibilityState !== "visible" || liveInFlight) return;
  liveInFlight = true;
  try {
    const data = await api("live", { timeoutMs: 8000 });
    applyLiveUpdate(data);
  } catch (e) {
    if (e instanceof AuthError) { liveInFlight = false; handleError(e); return; }
    // Silently ignore transient live polling errors to avoid disrupting forms.
  } finally {
    liveInFlight = false;
    scheduleLive(3000);
  }
}

function applyLiveUpdate(data) {
  if (!data || typeof data !== "object") return;
  const nowSec = data.now || Math.floor(Date.now() / 1000);
  const runningTotal = typeof data.running_total === "number"
    ? data.running_total
    : (data.users || []).reduce((a, x) => a + (x.running || 0), 0);
  state.running_total = runningTotal;

  let totalRpm = 0;
  const seen = new Set();
  for (const lu of (data.users || [])) {
    seen.add(lu.id);
    const rec = {
      running: lu.running || 0,
      max: lu.max || 0,
      rpm: lu.rpm || 0,
      rpm_limit: lu.rpm_limit || 0,
      oldest_started_at: lu.oldest_started_at || 0,
    };
    state.liveByUser.set(lu.id, rec);
    totalRpm += rec.rpm;
    const usr = userById(lu.id);
    if (usr && usr.quota) {
      usr.quota.running = rec.running;
      usr.quota.rpm = rec.rpm;
    }
    updateLiveUserCells(lu.id, rec, nowSec);
  }
  // Reset any users not reported in live payload
  for (const usr of state.users) {
    if (!seen.has(usr.id)) {
      const rec = { running: 0, max: usr.max_concurrency || 0, rpm: 0, rpm_limit: usr.rpm_limit || 0, oldest_started_at: 0 };
      state.liveByUser.set(usr.id, rec);
      if (usr.quota) { usr.quota.running = 0; usr.quota.rpm = 0; }
      updateLiveUserCells(usr.id, rec, nowSec);
    }
  }

  // Update KPI card in place
  const kpiRun = document.querySelector('[data-live="running-total"]');
  if (kpiRun) kpiRun.textContent = fmtInt.format(runningTotal);
  const kpiDot = document.querySelector('[data-live="running-dot"]');
  if (kpiDot) kpiDot.className = "live-dot" + (runningTotal > 0 ? " active" : "");
  const kpiRpm = document.querySelector('[data-live="rpm-total"]');
  if (kpiRpm) kpiRpm.textContent = `近 1 分钟 ${fmtInt.format(totalRpm)} 次请求`;
}

function updateLiveUserCells(uid, rec, nowSec) {
  const ccEl = document.querySelector(`[data-live-cc="${uid}"]`);
  if (ccEl) {
    const dot = ccEl.querySelector(".live-dot");
    const numEl = ccEl.querySelector(".running-num");
    const maxEl = ccEl.querySelector(".running-max");
    if (dot) dot.className = "live-dot" + (rec.running > 0 ? " active" : "");
    if (numEl) {
      numEl.textContent = String(rec.running);
      numEl.className = "running-num" + (rec.running > 0 ? " active" : "");
    }
    if (maxEl) maxEl.textContent = `/ ${rec.max > 0 ? rec.max : "—"}`;
    if (rec.running > 0 && rec.oldest_started_at > 0) {
      const sec = Math.max(0, Math.round(nowSec - rec.oldest_started_at));
      ccEl.title = `最早进行中请求已持续 ${sec} 秒`;
    } else {
      ccEl.removeAttribute("title");
    }
  }
  const rpmEl = document.querySelector(`[data-live-rpm="${uid}"]`);
  if (rpmEl) {
    rpmEl.replaceChildren(
      h("span", { class: rec.rpm > 0 ? "running-num" : "muted" }, fmtInt.format(rec.rpm)),
      h("span", { class: "faint" }, ` / ${rec.rpm_limit > 0 ? fmtInt.format(rec.rpm_limit) : "—"}`)
    );
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.loaded) {
    pollLive();
  } else {
    stopLive();
  }
});

// ---------- helpers ----------
const userById = (id) => state.users.find((u) => u.id === id);
const groupById = (id) => state.groups.find((g) => g.id === id);
const keyById = (id) => state.keys.find((k) => k.id === id);
const userLabel = (id) => (id === 0 ? "原生 Key / 其他" : (userById(id)?.name ?? `已删除用户 #${id}`));

function when(ts) {
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
  return d.toLocaleDateString("zh-CN");
}

function expiryLabel(u) {
  if (!u.expires_at) return "永久";
  const d = new Date(u.expires_at * 1000 - 1);
  return d.toLocaleDateString("zh-CN");
}

function statusBadge(u) {
  if (u.disabled) return h("span", { class: "status off" }, "已停用");
  if (u.expires_at && u.expires_at * 1000 <= Date.now()) return h("span", { class: "status bad" }, "已过期");
  return h("span", { class: "status" }, "正常");
}

function costMeter(spent, limit, subText) {
  const s = Number(spent) || 0;
  const lim = Number(limit) || 0;
  const nodes = [
    h("div", { class: "meter-top" },
      h("span", { class: "meter-spent" }, fmtMoney(s)),
      h("span", { class: "meter-limit" }, `/ ${lim > 0 ? fmtMoney(lim) : "—"}`)
    )
  ];
  if (lim > 0) {
    const pct = Math.min(100, (s / lim) * 100);
    nodes.push(h("div", { class: "bar" },
      h("span", { class: budgetClass(pct), style: { width: `${pct.toFixed(1)}%` } })
    ));
  }
  if (subText) nodes.push(h("div", { class: "meter-sub" }, subText));
  return h("div", { class: "meter" }, nodes);
}

function modelChipsEl(list, max = 4) {
  if (!list || !list.length) return h("span", { class: "faint" }, "无");
  const frag = document.createDocumentFragment();
  list.slice(0, max).forEach((m) => frag.appendChild(h("span", { class: "chip" }, m)));
  if (list.length > max) frag.appendChild(h("span", { class: "faint" }, `+${list.length - max}`));
  return frag;
}

function dateInputValue(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000 - 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function limitSummary(u) {
  const parts = [];
  if (u.daily_cost_limit > 0) parts.push(`日 ${fmtMoney(u.daily_cost_limit)}`);
  if (u.monthly_cost_limit > 0) parts.push(`月 ${fmtMoney(u.monthly_cost_limit)}`);
  if (u.total_cost_limit > 0) parts.push(`累计 ${fmtMoney(u.total_cost_limit)}`);
  if (u.max_concurrency > 0) parts.push(`并发 ${u.max_concurrency}`);
  if (u.rpm_limit > 0) parts.push(`RPM ${u.rpm_limit}`);
  if (u.daily_tokens > 0) parts.push(`日 ${num(u.daily_tokens)} Token`);
  if (u.monthly_tokens > 0) parts.push(`月 ${num(u.monthly_tokens)} Token`);
  if (u.daily_requests > 0) parts.push(`日 ${num(u.daily_requests)} 次`);
  if (u.monthly_requests > 0) parts.push(`月 ${num(u.monthly_requests)} 次`);
  return parts.length ? h("span", { class: "muted", style: { fontSize: "12.5px" } }, parts.join(" · ")) : h("span", { class: "faint" }, "不限");
}

// ---------- main layout ----------
function render() {
  const app = $("#app");
  const unpricedCount = (state.unpriced_models || []).length;
  const tabs = [
    ["overview", "概览"],
    ["users", "用户"],
    ["groups", "模型分组"],
    ["prices", "价格", unpricedCount],
    ["logs", "请求记录"],
  ];

  const header = h("header", { class: "top" },
    h("h1", null, "用户分发"),
    state.version ? h("span", { class: "ver" }, `v${state.version}`) : null,
    unpricedCount > 0 ? h("button", {
      class: "warn-pill",
      type: "button",
      title: "点击前往「价格」页配置未定价模型",
      onClick: () => switchTab("prices")
    }, h("span", { class: "warn-dot" }), `${unpricedCount} 个模型未设置价格`) : null,
    h("span", { class: "spacer" }),
    h("button", {
      class: "btn",
      type: "button",
      title: meURL() || "先在插件设置里填写 public_base_url",
      onClick: () => {
        if (!meURL()) { toast("先在插件设置里填写 public_base_url（用户访问 CPA 的地址）", true); return; }
        copyText(meURL(), "自助查询链接已复制，发给用户即可");
      }
    }, "复制自助查询链接"),
    h("button", { class: "btn", type: "button", onClick: refresh }, "刷新")
  );

  const nav = h("nav", { class: "tabs", role: "tablist" },
    tabs.map(([id, label, badge]) =>
      h("button", {
        class: "tab",
        role: "tab",
        type: "button",
        "aria-selected": String(view.tab === id),
        onClick: () => switchTab(id)
      },
        label,
        badge > 0 ? h("span", { class: "tab-badge" }, String(badge)) : null
      )
    )
  );

  const main = h("main", { id: "main" });
  setChildren(app,
    header,
    state.error ? h("div", { class: "notice" }, `插件存储不可用：${state.error}`) : null,
    nav,
    main
  );

  ({
    overview: renderOverview,
    users: renderUsers,
    groups: renderGroups,
    prices: renderPrices,
    logs: renderLogs,
  })[view.tab]();
}

async function switchTab(tabId) {
  view.tab = tabId;
  try {
    if (tabId === "overview") await loadUsage();
    if (tabId === "logs") await loadLogs();
  } catch (e) { handleError(e); return; }
  render();
}

function buildOverviewUsersTable(u) {
  if (!state.users.length) {
    return h("div", { class: "empty" },
      h("div", null, "还没有用户，先新建一个"),
      h("button", { class: "btn primary", type: "button", onClick: () => openUserDialog(null) }, "新建用户")
    );
  }

  const sortBy = (key) => {
    if (view.sortKey === key) view.sortDir = -view.sortDir;
    else { view.sortKey = key; view.sortDir = -1; }
    renderOverview();
  };

  const sortHeader = (label, key, alignNum = false) => {
    const active = view.sortKey === key;
    return h("th", {
      class: (alignNum ? "num " : "") + "sortable",
      onClick: () => sortBy(key)
    },
      label,
      active ? h("span", { class: "sort-ind" }, view.sortDir < 0 ? "↓" : "↑") : null
    );
  };

  const sorted = [...state.users].sort((a, b) => {
    const qa = qOf(a), qb = qOf(b);
    let diff = 0;
    switch (view.sortKey) {
      case "running": diff = qa.running - qb.running; break;
      case "rpm": diff = qa.rpm - qb.rpm; break;
      case "month_cost": diff = qa.month.cost - qb.month.cost; break;
      case "total_cost": diff = qa.total_cost - qb.total_cost; break;
      case "day_cost":
      default: diff = qa.day.cost - qb.day.cost; break;
    }
    if (diff !== 0) return diff * view.sortDir;
    if (qb.day.cost !== qa.day.cost) return qb.day.cost - qa.day.cost;
    if (qb.month.cost !== qa.month.cost) return qb.month.cost - qa.month.cost;
    return a.name.localeCompare(b.name, "zh-CN");
  });

  const nowSec = Math.floor(Date.now() / 1000);
  const rows = sorted.map((usr) => {
    const q = qOf(usr);
    const color = userColor.get(usr.id) || "var(--series-other)";
    const grpName = groupById(usr.group_id)?.name || "无分组";

    const ccCell = h("span", {
      class: "live-cell",
      dataset: { liveCc: usr.id },
      title: q.running > 0 && q.oldest_started_at > 0 ? `最早进行中请求已持续 ${Math.max(0, Math.round(nowSec - q.oldest_started_at))} 秒` : undefined
    },
      h("span", { class: "live-dot" + (q.running > 0 ? " active" : "") }),
      h("span", { class: "running-num" + (q.running > 0 ? " active" : "") }, String(q.running)),
      h("span", { class: "faint running-max" }, `/ ${usr.max_concurrency > 0 ? usr.max_concurrency : "—"}`)
    );

    const rpmCell = h("span", { class: "nowrap", dataset: { liveRpm: usr.id } },
      h("span", { class: q.rpm > 0 ? "running-num" : "muted" }, fmtInt.format(q.rpm)),
      h("span", { class: "faint" }, ` / ${usr.rpm_limit > 0 ? fmtInt.format(usr.rpm_limit) : "—"}`)
    );

    const totalCell = usr.total_cost_limit > 0
      ? costMeter(q.total_cost, usr.total_cost_limit)
      : h("span", { class: "tnum", style: { fontWeight: "500" } }, fmtMoney(q.total_cost));

    return h("tr", null,
      h("td", null,
        h("div", { class: "name-cell" },
          h("span", { class: "name-line" },
            h("span", { class: "swatch", style: { background: color } }),
            usr.name
          ),
          h("small", null, usr.note ? `${grpName} · ${usr.note}` : grpName)
        )
      ),
      h("td", { class: "num" }, ccCell),
      h("td", { class: "num" }, rpmCell),
      h("td", null, costMeter(q.day.cost, usr.daily_cost_limit, `${num(q.day.tokens)} Token · ${fmtInt.format(q.day.requests)} 次`)),
      h("td", null, costMeter(q.month.cost, usr.monthly_cost_limit, `${num(q.month.tokens)} Token · ${fmtInt.format(q.month.requests)} 次`)),
      h("td", { class: usr.total_cost_limit > 0 ? "" : "num nowrap" }, totalCell),
      h("td", { class: "nowrap muted", style: { fontSize: "13px" } }, expiryLabel(usr)),
      h("td", { class: "nowrap" }, statusBadge(usr))
    );
  });

  // Include native-key traffic footnote row if present in usage report
  const nativeUsage = (u.by_user || {})["0"];
  if (nativeUsage && (nativeUsage.requests > 0 || nativeUsage.total_tokens > 0 || nativeUsage.cost > 0)) {
    rows.push(h("tr", { style: { opacity: "0.8" } },
      h("td", null,
        h("div", { class: "name-cell" },
          h("span", { class: "name-line" },
            h("span", { class: "swatch", style: { background: "var(--series-other)" } }),
            "原生 Key / 其他"
          ),
          h("small", null, `不受插件限制 · 最近 ${view.days} 天`)
        )
      ),
      h("td", { class: "num faint" }, "—"),
      h("td", { class: "num faint" }, "—"),
      h("td", { class: "faint", colspan: "2" },
        `近 ${view.days} 天 ${fmtMoney(nativeUsage.cost || 0)} · ${num(nativeUsage.total_tokens)} Token · ${fmtInt.format(nativeUsage.requests || 0)} 次`
      ),
      h("td", { class: "num faint" }, "—"),
      h("td", { class: "faint" }, "—"),
      h("td", { class: "faint" }, "原生")
    ));
  }

  return h("table", null,
    h("thead", null,
      h("tr", null,
        h("th", null, "名称"),
        sortHeader("当前并发", "running", true),
        sortHeader("RPM", "rpm", true),
        sortHeader("今日金额 / 日限额", "day_cost", false),
        sortHeader("本月金额 / 月限额", "month_cost", false),
        sortHeader("累计金额", "total_cost", true),
        h("th", null, "到期"),
        h("th", null, "状态")
      )

    h("tbody", null, rows)
  );

// ---------- stacked daily chart (inline SVG via svgEl) ----------
function renderChart() {
  const host = $("#chart");
  const legend = $("#legend");
  if (!host || !state.usage) return;
  const u = state.usage;
  const days = u.days || [];
  if (!days.length) {
    legend.replaceChildren();
    host.replaceChildren(h("div", { class: "empty" }, "暂无数据。"));
    return;
  }

  const metricKey = view.metric === "cost" ? "cost" : (view.metric === "tokens" ? "total_tokens" : "requests");
  const series = [];
  const other = { id: "other", label: "其他", color: "var(--series-other)", values: days.map(() => 0) };

  for (const [uid, daily] of Object.entries(u.user_daily || {})) {
    const id = Number(uid);
    const vals = days.map((_, i) => Number((daily[i] && daily[i][metricKey]) || 0));
    if (!vals.some((v) => v > 0)) continue;
    const usr = userById(id);
    const color = usr ? userColor.get(id) : null;
    if (!usr || color === "var(--series-other)") {
      vals.forEach((v, i) => { other.values[i] += v; });
      if (id === 0) other.label = "其他 / 原生 Key";
      continue;
    }
    series.push({ id, label: usr.name, color, values: vals, order: state.users.indexOf(usr) });
  }
  series.sort((a, b) => a.order - b.order);
  if (other.values.some((v) => v > 0)) series.push(other);

  // Fallback to u.daily if user_daily is empty
  if (!series.length && Array.isArray(u.daily) && u.daily.some((d) => Number(d[metricKey] || 0) > 0)) {
    series.push({
      id: "all",
      label: "合计",
      color: "var(--series-1)",
      values: days.map((_, i) => Number((u.daily[i] && u.daily[i][metricKey]) || 0))
    });
  }

  if (series.length > 1) {
    legend.replaceChildren(...series.map((s) =>
      h("span", { class: "legend-item" },
        h("i", { class: "legend-swatch", style: { background: s.color } }),
        s.label
      )
    ));
  } else {
    legend.replaceChildren();
  }

  const totals = days.map((_, i) => series.reduce((a, s) => a + s.values[i], 0));
  const max = Math.max(...totals, 0);
  if (!max) {
    const hasRequests = (u.totals && (u.totals.requests > 0 || u.totals.total_tokens > 0));
    host.replaceChildren(h("div", { class: "empty" },
      view.metric === "cost" && hasRequests
        ? "这个时间段消费金额为 0，可到「价格」页配置模型单价后重算历史。"
        : "这个时间段还没有用量。"
    ));
    return;
  }

  const W = Math.max(host.clientWidth || 0, 300);
  const H = 230, padL = 56, padR = 10, padT = 10, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const step = niceStep(max / 4);
  const tickCount = Math.max(1, Math.ceil(max / step));
  const top = tickCount * step;
  const n = days.length;
  const slot = plotW / n;
  const bw = Math.max(4, Math.min(34, slot * 0.6));
  const y = (v) => padT + plotH - (v / top) * plotH;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": view.metric === "cost" ? "每日消费" : "每日用量" });

  for (let t = 0; t <= tickCount; t++) {
    const v = t * step;
    const yPos = y(v);
    svg.appendChild(svgEl("line", { class: "grid", x1: padL, x2: W - padR, y1: yPos, y2: yPos }));
    svg.appendChild(svgEl("text", { class: "axis", x: padL - 7, y: yPos + 4, "text-anchor": "end" },
      view.metric === "cost" ? fmtAxisCost(v) : num(v)
    ));
  }

  const labelEvery = Math.ceil(n / Math.max(1, Math.floor(plotW / 56)));
  days.forEach((d, i) => {
    const cx = padL + slot * i + slot / 2;
    const isLast = i === n - 1;
    const showTick = isLast || (i % labelEvery === 0 && (n - 1 - i) >= Math.ceil(labelEvery * 0.6));
    if (showTick) {
      svg.appendChild(svgEl("text", { class: "axis", x: cx, y: H - 6, "text-anchor": "middle" }, d.slice(5)));
    }
    let base = 0;
    const segs = series.map((s) => ({ s, v: s.values[i] })).filter((x) => x.v > 0);
    segs.forEach((seg, j) => {
      const y0 = y(base), y1 = y(base + seg.v);
      base += seg.v;
      const isTop = j === segs.length - 1;
      const gap = isTop ? 0 : 1.5;
      const barH = Math.max(1, y0 - y1 - gap);
      const x = cx - bw / 2;
      const pathD = isTop
        ? roundTop(x, y1, bw, Math.max(1, y0 - y1), Math.min(4, bw / 2))
        : `M${x},${y1 + gap}h${bw}v${barH}h${-bw}z`;
      const p = svgEl("path", { d: pathD, fill: seg.s.color });
      p.style.pointerEvents = "none";
      svg.appendChild(p);
    });
    svg.appendChild(svgEl("rect", {
      x: padL + slot * i, y: padT, width: slot, height: plotH,
      fill: "transparent", "data-day": i
    }));
  });

  host.replaceChildren(svg);

  const tip = $("#tip");
  const fmtVal = (v) => {
    if (view.metric === "cost") return fmtMoney(v);
    if (view.metric === "tokens") return `${fmtInt.format(v)} Token`;
    return `${fmtInt.format(v)} 次`;
  };

  host.onmousemove = (e) => {
    const t = e.target.closest("[data-day]");
    if (!t) { tip.style.display = "none"; return; }
    const i = Number(t.dataset.day);
    const activeRows = series.filter((s) => s.values[i] > 0).reverse();
    setChildren(tip,
      h("div", { class: "tip-head" }, `${days[i]} · 合计 `, h("strong", null, fmtVal(totals[i]))),
      activeRows.length
        ? activeRows.map((s) =>
            h("div", { class: "tip-row" },
              h("span", { class: "tip-label" },
                h("span", { class: "swatch", style: { background: s.color } }),
                s.label
              ),
              h("strong", null, fmtVal(s.values[i]))
            )
          )
        : h("div", { class: "faint" }, "无记录")
    );
    tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    let left = e.clientX + 14, topPx = e.clientY + 14;
    if (left + r.width > innerWidth - 8) left = e.clientX - r.width - 14;
    if (topPx + r.height > innerHeight - 8) topPx = e.clientY - r.height - 14;
    tip.style.left = `${Math.max(8, left)}px`;
    tip.style.top = `${Math.max(8, topPx)}px`;
  };
  host.onmouseleave = () => { tip.style.display = "none"; };
}

function niceStep(raw) {
  if (!raw || raw <= 0 || !Number.isFinite(raw)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}

function roundTop(x, y, w, hVal, r) {
  r = Math.min(r, hVal);
  return `M${x},${y + hVal}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + hVal}Z`;
}

// Model picker: known models as checkboxes plus wildcard rules.
function createModelPicker(initial, { emptyHint, onChange } = {}) {
  const selected = new Set((initial || []).map((m) => m.toLowerCase()));
  const qInput = h("input", { class: "input", placeholder: "搜索模型，或输入规则如 gpt-5* 后回车" });
  const listEl = h("div", { class: "list" });
  const selEl = h("div", { class: "selected" });

  const notify = () => { if (onChange) onChange(); };

  const draw = () => {
    const term = qInput.value.trim().toLowerCase();
    const models = state.models.filter((m) => !term || m.toLowerCase().includes(term));
    if (models.length) {
      listEl.replaceChildren(...models.map((m) => {
        const lower = m.toLowerCase();
        const cb = h("input", {
          type: "checkbox",
          checked: selected.has(lower),
          onChange: (e) => {
            if (e.target.checked) selected.add(lower); else selected.delete(lower);
            draw();
            notify();
          }
        });
        return h("label", { title: m }, cb, h("span", null, m));
      }));
    } else {
      listEl.replaceChildren(h("div", { class: "faint", style: { padding: "6px" } },
        state.models.length
          ? "没有匹配的模型，回车可作为通配规则添加"
          : "还没有发现模型：点「刷新列表」，或发一次 /v1/models 请求"
      ));
    }

    if (selected.size) {
      selEl.replaceChildren(...[...selected].sort().map((m) =>
        h("span", { class: "chip" },
          m,
          h("button", {
            type: "button",
            "aria-label": "移除",
            onClick: () => { selected.delete(m); draw(); notify(); }
          }, "×")
        )
      ));
    } else {
      selEl.replaceChildren(h("span", { class: "faint" }, emptyHint || "未选择任何模型"));
    }
  };

  const addRule = () => {
    const v = qInput.value.trim().toLowerCase();
    if (!v) return;
    selected.add(v);
    qInput.value = "";
    draw();
    notify();
  };

  qInput.addEventListener("input", draw);
  qInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addRule(); } });

  const el = h("div", { class: "picker" },
    h("div", { class: "picker-top" },
      qInput,
      h("button", { class: "btn small", type: "button", onClick: addRule }, "添加规则"),
      h("button", { class: "btn small", type: "button", onClick: () => { selected.add("*"); draw(); notify(); } }, "全部模型 *"),
      h("button", {
        class: "btn small",
        type: "button",
        title: "从 CPA 的凭证读取模型",
        onClick: async () => {
          try {
            const r = await api("models/refresh", { method: "POST", body: {} });
            state.models = r.models || [];
            draw();
            toast(r.added ? "已更新模型列表" : "没有新模型");
          } catch (e) { handleError(e); }
        }
      }, "刷新列表")
    ),
    listEl,
    selEl
  );

  draw();
  return { el, values: () => [...selected] };
}

function openUserDialog(u) {
  const nameIn = h("input", { maxlength: "40", required: true, value: u?.name || "" });
  const noteIn = h("input", { maxlength: "120", value: u?.note || "" });
  const grpSel = h("select", { value: String(u?.group_id || 0) },
    h("option", { value: "0" }, "不使用分组"),
    state.groups.map((g) => h("option", { value: String(g.id), selected: u?.group_id === g.id }, g.name))
  );
  const expIn = h("input", { type: "date", value: dateInputValue(u?.expires_at) });
  const disIn = h("input", { type: "checkbox", checked: Boolean(u?.disabled) });

  // Cost limits
  const dc = moneyField("每日金额上限", u?.daily_cost_limit);
  const mc = moneyField("每月金额上限", u?.monthly_cost_limit);
  const tc = moneyField("累计金额上限", u?.total_cost_limit);

  // Rate limits
  const cc = intField("最大并发", u?.max_concurrency, "同时进行中的请求数");
  const rpm = intField("每分钟请求数（RPM）", u?.rpm_limit, "最近 60 秒内允许的请求数");

  // Advanced token/request limits
  const dt = intField("每日 Token 上限", u?.daily_tokens);
  const mt = intField("每月 Token 上限", u?.monthly_tokens);
  const dr = intField("每日请求上限", u?.daily_requests);
  const mr = intField("每月请求上限", u?.monthly_requests);
  const hasAdvanced = Boolean(u && (u.daily_tokens || u.monthly_tokens || u.daily_requests || u.monthly_requests));

  const effEl = h("span");
  const updateEffective = () => {
    const g = groupById(Number(grpSel.value));
    const all = [...new Set([...(g?.models || []), ...picker.values()])].sort();
    if (all.length) {
      effEl.replaceChildren(modelChipsEl(all, 12));
    } else {
      effEl.replaceChildren(h("span", { style: { color: "var(--budget-bad)" } }, "无——该用户将无法调用任何模型"));
    }
  };
  const picker = createModelPicker(u?.extra_models, { emptyHint: "无额外模型", onChange: updateEffective });
  grpSel.addEventListener("change", updateEffective);
  updateEffective();

  const body = [
    h("div", { class: "grid2" },
      h("label", { class: "field" }, "名称", nameIn),
      h("label", { class: "field" }, "备注", noteIn),
      h("label", { class: "field" }, "模型分组", grpSel),
      h("label", { class: "field" }, "到期日", expIn, h("span", { class: "hint" }, "留空为永久；到期当天结束后停止服务"))
    ),
    h("div", { style: { marginTop: "10px" } },
      h("label", { class: "check" }, disIn, "停用该用户")
    ),

    // Money quota section
    h("div", { class: "form-section" },
      h("div", { class: "form-section-title" },
        "金额额度",
        h("span", { class: "hint", style: { fontWeight: "400" } }, "0 或留空为不限")
      ),
      h("div", { class: "grid3" }, dc.wrap, mc.wrap, tc.wrap)
    ),

    // Rate section
    h("div", { class: "form-section" },
      h("div", { class: "form-section-title" }, "速率与并发"),
      h("div", { class: "grid2" }, cc.wrap, rpm.wrap)
    ),

    // Collapsible advanced limits
    h("details", { class: "adv", open: hasAdvanced },
      h("summary", null, "高级额度（Token / 请求次数上限）"),
      h("div", { class: "adv-body" },
        h("div", { class: "grid2" }, dt.wrap, mt.wrap, dr.wrap, mr.wrap)
      )
    ),

    // Extra models
    h("div", { class: "form-section" },
      h("div", { class: "form-section-title" },
        "额外允许的模型",
        h("span", { class: "hint", style: { fontWeight: "400" } }, "与分组的模型合并生效")
      ),
      picker.el,
      h("div", { style: { marginTop: "10px", fontSize: "13px" }, class: "muted" }, "实际可用：", effEl)
    ),
    h("p", { class: "hint", style: { marginBottom: "0" } },
      "金额与 Token 上限在请求开始前检查，单个进行中的请求可能略微超出，超出后的下一次请求会被拒绝。"
    )
  ];

  openDialog(
    u ? `编辑用户：${u.name}` : "新建用户",
    body,
    [
      h("button", { class: "btn", type: "button", dataset: { close: "1" } }, "取消"),
      h("button", {
        class: "btn primary",
        type: "button",
        onClick: async () => {
          const flt = (inp) => Math.max(0, Number(inp.value) || 0);
          const intv = (inp) => Math.max(0, Math.floor(Number(inp.value) || 0));
          const exp = expIn.value;
          let expiresAt = 0;
          if (exp) {
            const [y, m, d] = exp.split("-").map(Number);
            expiresAt = Math.floor(new Date(y, m - 1, d + 1).getTime() / 1000);
          }
          const payload = {
            id: u?.id || 0,
            name: nameIn.value.trim(),
            note: noteIn.value.trim(),
            group_id: Number(grpSel.value) || 0,
            extra_models: picker.values(),
            disabled: disIn.checked,
            expires_at: expiresAt,
            daily_cost_limit: flt(dc.input),
            monthly_cost_limit: flt(mc.input),
            total_cost_limit: flt(tc.input),
            max_concurrency: intv(cc.input),
            rpm_limit: intv(rpm.input),
            daily_tokens: intv(dt.input),
            monthly_tokens: intv(mt.input),
            daily_requests: intv(dr.input),
            monthly_requests: intv(mr.input),
          };
          if (!payload.name) { toast("请填写用户名称", true); nameIn.focus(); return; }
          try {
            const r = await api("user/save", { method: "POST", body: payload });
            dlg.close();
            toast("已保存");
            await refresh();
            if (!u) {
              const created = userById(r.id);
              if (created) openKeysDialog(created, true);
            }
          } catch (e) { handleError(e); }
        }
      }, "保存")
    ]
  );
}
