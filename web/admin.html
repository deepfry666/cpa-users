  const main = $("#main");
  const sym = currencySymbol();
  const knownModels = [...new Set([...(state.models || []), ...(state.unpriced_models || [])])].sort();

  const datalist = h("datalist", { id: "known-models-list" },
    knownModels.map((m) => h("option", { value: m }))
  );

  // Add-price form inputs
  const addModel = h("input", {
    class: "input mono",
    list: "known-models-list",
    placeholder: "模型名或通配规则，如 gpt-5*",
    value: view.prefillPriceModel || ""
  });
  const addIn = h("input", { class: "input tnum", type: "number", min: "0", step: "any", placeholder: "0" });
  const addCached = h("input", { class: "input tnum", type: "number", min: "0", step: "any", placeholder: "0" });
  const addOut = h("input", { class: "input tnum", type: "number", min: "0", step: "any", placeholder: "0" });
  const addReq = h("input", { class: "input tnum", type: "number", min: "0", step: "any", placeholder: "0" });
  const addNote = h("input", { class: "input", placeholder: "备注（可选）", maxlength: "120" });

  const submitAdd = async () => {
    const model = addModel.value.trim();
    if (!model) { toast("请填写模型名称或规则", true); addModel.focus(); return; }
    const body = {
      model,
      input: Math.max(0, Number(addIn.value) || 0),
      cached: Math.max(0, Number(addCached.value) || 0),
      output: Math.max(0, Number(addOut.value) || 0),
      per_request: Math.max(0, Number(addReq.value) || 0),
      note: addNote.value.trim(),
    };
    try {
      const r = await api("price/save", { method: "POST", body });
      view.prefillPriceModel = "";
      const filled = (r.backfilled_models || []).length;
      toast(filled ? `已保存价格：${model}，已补算 ${filled} 个模型的历史金额` : `已保存价格：${model}`);
      if (filled && state.usage) await loadUsage();
      await loadState();
      render();
    } catch (e) { handleError(e); }
  };

  for (const inp of [addModel, addIn, addCached, addOut, addReq, addNote]) {
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitAdd(); } });
  }

  // Unpriced models highlight box
  const unpricedBox = (state.unpriced_models && state.unpriced_models.length)
    ? h("div", { class: "notice warn-box" },
        h("div", { style: { fontWeight: "600", color: "var(--warn-text)" } },
          `${state.unpriced_models.length} 个已产生用量的模型未匹配到价格规则`
        ),
        h("div", { class: "hint", style: { marginTop: "2px" } },
          "官方价格表里查不到这些模型（多为 CPA 内部名称或别名），需要手动填写。点击模型即可填入新增栏。"
        ),
        h("div", { class: "unpriced-list" },
          state.unpriced_models.map((m) =>
            h("span", { class: "unpriced-item" },
              h("span", { class: "mono" }, m),
              h("button", {
                class: "btn small",
                type: "button",
                onClick: () => {
                  addModel.value = m;
                  addIn.focus();
                  addModel.scrollIntoView({ behavior: "smooth", block: "center" });
                }
              }, "添加价格")
            )
          )
        )
      )
    : null;

  const recomputeBtn = h("button", {
    class: "btn",
    type: "button",
    onClick: async () => {
      if (!confirm("按当前价格重新计算全部历史金额？")) return;
      recomputeBtn.disabled = true;
      recomputeBtn.textContent = "重算中…";
      try {
        const r = await api("prices/recompute", { method: "POST", body: {} });
        toast(`历史金额重算完成（更新 ${fmtInt.format(r.updated || 0)} 条）`);
        await loadState();
        if (state.usage) await loadUsage();
        render();
      } catch (e) {
        recomputeBtn.disabled = false;
        recomputeBtn.textContent = "按当前价格重算历史";
        handleError(e);
      }
    }
  }, "按当前价格重算历史");

  // Automatic price sync status
  const ps = state.price_sync;
  const ago = (ts) => {
    if (!ts) return "从未";
    const sec = Math.max(0, Math.round(Date.now() / 1000 - ts));
    if (sec < 90) return "刚刚";
    if (sec < 3600) return `${Math.round(sec / 60)} 分钟前`;
    if (sec < 86400) return `${Math.round(sec / 3600)} 小时前`;
    return `${Math.round(sec / 86400)} 天前`;
  };
  const syncBtn = h("button", {
    class: "btn small",
    type: "button",
    onClick: async () => {
      syncBtn.disabled = true;
      syncBtn.textContent = "同步中…";
      try {
        const r = await api("prices/sync", { method: "POST", body: {} });
        toast(r.updated ? `已同步，更新 ${r.updated} 个模型价格` : "已同步，价格没有变化");
        await loadState();
        if (state.usage) await loadUsage();
        render();
      } catch (e) {
        syncBtn.disabled = false;
        syncBtn.textContent = "立即同步";
        handleError(e);
      }
    }
  }, "立即同步");
  const syncBar = ps ? h("div", { class: "sync-bar" },
    h("span", null, h("strong", null, ps.enabled ? "自动同步官方价格" : "自动同步已关闭"),
      `（LiteLLM 优先，OpenRouter 补充；每 ${state.config.price_sync_hours || 12} 小时）`),
    h("span", null, `上次：${ago(ps.last_at)}`),
    ps.last_at ? h("span", null, `匹配 ${ps.matched || 0} 个`) : null,
    (ps.unmatched && ps.unmatched.length)
      ? h("span", { title: ps.unmatched.join("\n") }, `${ps.unmatched.length} 个查不到官方价：${ps.unmatched.slice(0, 4).join("、")}${ps.unmatched.length > 4 ? " 等" : ""}`)
      : null,
    ps.error ? h("span", { class: "err" }, ps.error) : null,
    h("span", { class: "spacer" }),
    syncBtn
  ) : null;

  const addBar = h("div", { class: "price-add-bar" },
    h("label", { class: "field span-full" }, "模型 / 通配规则", addModel),
    h("label", { class: "field" }, `输入 (${sym}/1M)`, addIn),
    h("label", { class: "field" }, `缓存输入 (${sym}/1M)`, addCached),
    h("label", { class: "field" }, `输出 (${sym}/1M)`, addOut),
    h("label", { class: "field" }, `每次请求 (${sym})`, addReq),
    h("label", { class: "field" }, "备注", addNote),
    h("button", { class: "btn primary", type: "button", onClick: submitAdd }, "添加价格")
  );

  // Existing prices editable table
  const priceRows = (state.prices || []).map((p) => {
    const orig = {
      model: p.model || "",
      input: Number(p.input) || 0,
      cached: Number(p.cached) || 0,
      output: Number(p.output) || 0,
      per_request: Number(p.per_request) || 0,
      note: p.note || "",
      source: p.source || "manual",
    };
    const isAuto = orig.source !== "manual";
    const srcLabel = { litellm: "LiteLLM", openrouter: "OpenRouter" }[orig.source] || orig.source;
    const srcChip = h("span", {
      class: isAuto ? "chip src auto" : "chip src",
      title: isAuto ? "自动同步的官方价格，会随数据源更新；手动修改后改为固定价格" : "手动填写，自动同步不会覆盖"
    }, isAuto ? srcLabel : "手动");
    const mIn = h("input", { class: "cell-in model-in", list: "known-models-list", value: orig.model });
    const inIn = h("input", { class: "cell-in num-in", type: "number", min: "0", step: "any", value: String(orig.input) });
    const caIn = h("input", { class: "cell-in num-in", type: "number", min: "0", step: "any", value: String(orig.cached) });
    const outIn = h("input", { class: "cell-in num-in", type: "number", min: "0", step: "any", value: String(orig.output) });
    const reqIn = h("input", { class: "cell-in num-in", type: "number", min: "0", step: "any", value: String(orig.per_request) });
    const noteIn = h("input", { class: "cell-in note-in", value: orig.note, maxlength: "120", placeholder: "—" });
    const saveBtn = h("button", { class: "btn small", type: "button", disabled: true }, "保存");
    const tr = h("tr");

    const checkDirty = () => {
      const dirty =
        mIn.value.trim() !== orig.model ||
        (Number(inIn.value) || 0) !== orig.input ||
        (Number(caIn.value) || 0) !== orig.cached ||
        (Number(outIn.value) || 0) !== orig.output ||
        (Number(reqIn.value) || 0) !== orig.per_request ||
        noteIn.value.trim() !== orig.note;
      tr.classList.toggle("dirty", dirty);
      saveBtn.disabled = !dirty;
      saveBtn.className = dirty ? "btn small primary" : "btn small";
    };

    const doSave = async () => {
      const newModel = mIn.value.trim();
      if (!newModel) { toast("模型名称不能为空", true); mIn.focus(); return; }
      const body = {
        model: newModel,
        input: Math.max(0, Number(inIn.value) || 0),
        cached: Math.max(0, Number(caIn.value) || 0),
        output: Math.max(0, Number(outIn.value) || 0),
        per_request: Math.max(0, Number(reqIn.value) || 0),
        note: noteIn.value.trim(),
      };
      if (newModel !== orig.model) body.old_model = orig.model;
      if (isAuto && !confirm("改成手动价格后，这个模型不再随官方价格自动更新。继续？")) return;
      try {
        await api("price/save", { method: "POST", body });
        toast(`已更新价格：${newModel}`);
        await loadState();
        render();
      } catch (e) { handleError(e); }
    };

    saveBtn.addEventListener("click", doSave);
    for (const inp of [mIn, inIn, caIn, outIn, reqIn, noteIn]) {
      inp.addEventListener("input", checkDirty);
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter" && !saveBtn.disabled) { e.preventDefault(); doSave(); } });
    }

    const delBtn = h("button", {
      class: "btn small danger",
      type: "button",
      onClick: async () => {
        if (!confirm(`删除价格规则「${orig.model}」？`)) return;
        try {
          await api("price/delete", { method: "POST", body: { model: orig.model } });
          toast("已删除");
          await loadState();
          render();
        } catch (e) { handleError(e); }
      }
    }, "删除");

    const revertBtn = (!isAuto && state.price_sync && state.price_sync.enabled && !orig.model.includes("*"))
      ? h("button", {
          class: "btn small",
          type: "button",
          title: "删除手动价格并从官方价格表重新同步",
          onClick: async () => {
            if (!confirm(`「${orig.model}」改回自动同步的官方价格？`)) return;
            revertBtn.disabled = true;
            try {
              await api("price/auto", { method: "POST", body: { model: orig.model } });
              toast("已改回官方价格");
              await loadState();
              render();
            } catch (e) {
              revertBtn.disabled = false;
              handleError(e);
            }
          }
        }, "改回自动")
      : null;

    tr.replaceChildren(
      h("td", { class: "nowrap" }, mIn, srcChip),
      h("td", { class: "num" }, inIn),
      h("td", { class: "num" }, caIn),
      h("td", { class: "num" }, outIn),
      h("td", { class: "num" }, reqIn),
      h("td", null, noteIn),
      h("td", { class: "nowrap", style: { textAlign: "right" } },
        h("div", { class: "row", style: { justifyContent: "flex-end", gap: "6px", flexWrap: "nowrap" } }, saveBtn, revertBtn, delBtn)
      )
    );
    return tr;
  });

  const tableOrEmpty = priceRows.length
    ? h("div", { class: "table-scroll" },
        h("table", { class: "price-table" },
          h("thead", null,
            h("tr", null,
              h("th", null, "模型 / 通配规则"),
              h("th", { class: "num" }, `输入 (${sym}/1M)`),
              h("th", { class: "num" }, `缓存输入 (${sym}/1M)`),
              h("th", { class: "num" }, `输出 (${sym}/1M)`),
              h("th", { class: "num" }, `每次请求 (${sym})`),
              h("th", null, "备注"),
              h("th", null, "")
            )
          ),
          h("tbody", null, priceRows)
        )
      )
    : h("div", { class: "empty" }, "还没有配置模型价格。在上方添加模型单价后，系统会按用量自动折算等价 API 消费金额。");

  const card = h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("h2", null, "模型价格"),
      h("span", { class: "card-sub" }, `单位：${sym} / 1M Token（或每次成功请求） · 支持通配符如 gpt-5*`),
      h("span", { class: "spacer" }),
      recomputeBtn
    ),
    syncBar,
    unpricedBox,
    addBar,
    tableOrEmpty,
    h("p", { class: "hint", style: { marginBottom: "0" } },
      "直接点击表格中的单元格即可编辑，回车或点「保存」生效。图片等按次计费模型可填写「每次请求」价格。"
    )
  );

  main.replaceChildren(datalist, card);
  if (view.prefillPriceModel) {
    view.prefillPriceModel = "";
    addIn.focus();
  }
}

// ---------- tab 5: logs ----------
function renderLogs() {
  const main = $("#main");

  const userSelect = h("select", {
    class: "input auto-w",
    value: view.logUser,
    onChange: async (e) => {
      view.logUser = e.target.value;
      try { await loadLogs(); renderLogs(); } catch (err) { handleError(err); }
    }
  },
    h("option", { value: "" }, "全部用户"),
    state.users.map((u) => h("option", { value: String(u.id), selected: String(u.id) === view.logUser }, u.name)),
    h("option", { value: "0", selected: view.logUser === "0" }, "原生 Key / 其他")
  );

  const failedCheck = h("label", { class: "check" },
    h("input", {
      type: "checkbox",
      checked: view.logFailed,
      onChange: async (e) => {
        view.logFailed = e.target.checked;
        try { await loadLogs(); renderLogs(); } catch (err) { handleError(err); }
      }
    }),
    "只看失败"
  );

  let content;
  if (state.logs.length) {
    const tbody = h("tbody");
    for (const l of state.logs) {
      const hasErr = Boolean(l.failed && l.error);
      const keyInfo = keyById(l.key_id);
      const keyText = keyInfo?.name || keyInfo?.hint || (l.key_id ? `#${l.key_id}` : "—");
      const statusCell = h("td", { class: "nowrap" },
        l.failed
          ? h("span", { class: "status bad" }, String(l.status || "失败"))
          : h("span", { class: "status" }, String(l.status || 200)),
        l.stream ? h("span", { class: "faint", style: { marginLeft: "5px", fontSize: "12px" } }, "流式") : null
      );

      tbody.appendChild(h("tr", { class: hasErr ? "has-err" : "" },
        h("td", { class: "nowrap" }, new Date(l.ts * 1000).toLocaleString("zh-CN", { hour12: false })),
        h("td", { class: "nowrap" }, userLabel(l.user_id)),
        h("td", { class: "mono nowrap" }, keyText),
        h("td", { class: "mono" }, l.model || "—"),
        statusCell,
        h("td", { class: "num" }, fmtInt.format(l.input_tokens || 0)),
        h("td", { class: "num" }, fmtInt.format(l.output_tokens || 0)),
        h("td", { class: "num nowrap", style: { fontWeight: "500" } }, fmtMoney(l.cost || 0)),
        h("td", { class: "num nowrap" }, `${((l.latency_ms || 0) / 1000).toFixed(1)}s`),
        h("td", { class: "num nowrap" }, l.ttft_ms ? `${(l.ttft_ms / 1000).toFixed(1)}s` : "—")
      ));

      if (hasErr) {
        // Security: upstream error text is attacker-controlled; render strictly via textContent.
        tbody.appendChild(h("tr", { class: "sub-err" },
          h("td", null),
          h("td", { colspan: "9" }, h("div", { class: "err-box" }, l.error))
        ));
      }
    }

    content = h("div", { class: "table-scroll" },
      h("table", null,
        h("thead", null,
          h("tr", null,
            h("th", null, "时间"),
            h("th", null, "用户"),
            h("th", null, "Key"),
            h("th", null, "模型"),
            h("th", null, "状态"),
            h("th", { class: "num" }, "输入"),
            h("th", { class: "num" }, "输出"),
            h("th", { class: "num" }, "金额"),
            h("th", { class: "num" }, "耗时"),
            h("th", { class: "num" }, "首字")
          )
        ),
        tbody
      )
    );
  } else {
    content = h("div", { class: "empty" },
      "没有记录。被插件拒绝（无权限 / 超额）的请求不会到达上游，也不会出现在这里。"
    );
  }

  main.replaceChildren(
    h("section", { class: "card" },
      h("div", { class: "card-head" },
        h("h2", null, "请求记录"),
        h("span", { class: "spacer" }),
        userSelect,
        failedCheck
      ),
      content,
      h("p", { class: "hint", style: { marginBottom: "0" } },
        `最多显示最近 300 条；明细保留 ${state.config.log_retention || 30} 天，按小时汇总的数据永久保留。`
      )
    )
  );
}

// ---------- login ----------
function renderLogin(message) {
  const host = document.documentElement.dataset.host;
  const hostHint = host === "cpamc"
    ? "在管理中心登录时勾选「记住密码」，以后打开这里就不用再输。"
    : host === "frame"
      ? "在 Oh My CPA 中打开时会自动使用它保存的管理密钥；出现这个页面说明那个密钥没有被 CPA 接受。"
      : "";

  const keyIn = h("input", {
    class: "input",
    type: "password",
    placeholder: "管理密钥",
    autocomplete: "current-password",
    required: true,
    style: { flex: "1" }
  });

  const form = h("form", {
    class: "row",
    onSubmit: async (e) => {
      e.preventDefault();
      mgmtKey = keyIn.value.trim();
      writeSessionKey(mgmtKey);
      try {
        await loadState();
        await loadUsage();
        render();
        scheduleLive();
      } catch (err) { handleError(err); }
    }
  }, keyIn, h("button", { class: "btn primary", type: "submit" }, "进入"));

  $("#app").replaceChildren(
    h("div", { class: "login card" },
      h("h2", { style: { fontSize: "17px", margin: "0 0 8px" } }, "用户分发"),
      h("p", { class: "muted", style: { marginTop: "0", fontSize: "13.5px" } },
        `输入 CPA 的管理密钥（remote-management.secret-key）。${hostHint}`
      ),
      message ? h("div", { class: "notice" }, message) : null,
      form
    )
  );
}

// ---------- startup ----------
async function start() {
  // Try remembered key first, then no key (Oh My CPA injects server-side), and only then ask.
  const attempts = mgmtKey ? [mgmtKey, ""] : [""];
  let lastAuthError = null;
  for (const key of attempts) {
    mgmtKey = key;
    try {
      await loadState();
      await loadUsage();
      render();
      scheduleLive();
      return;
    } catch (e) {
      if (!(e instanceof AuthError)) { handleError(e); return; }
      lastAuthError = e;
      if (key) writeSessionKey("");
    }
  }
  renderLogin(attempts.length > 1 || parentDoc() ? lastAuthError?.message : "");
}

syncTheme();
start();
})();
</script>
</body>
</html>
