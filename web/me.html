<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的用量</title>
<style>
:root {
  color-scheme: light;
  --bg-secondary: #faf9f5; --bg-primary: #f2f0ea; --bg-tertiary: #e7e4dc;
  --text-primary: #22201d; --text-secondary: #625d56; --text-tertiary: #928c84;
  --border-color: #e2dfd7; --border-primary: #d2cec4;
  --accent: #2563eb; --accent-soft: rgba(37, 99, 235, 0.10);
  --budget-ok: #16a34a; --budget-warn: #d97706; --budget-bad: #dc2626;
  --warning-bg: rgba(198, 87, 70, 0.11);
  --shadow-lg: 0 12px 24px -6px rgb(0 0 0 / 0.14);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg-secondary: #141311; --bg-primary: #1c1a17; --bg-tertiary: #26231f;
    --text-primary: #f3f1ed; --text-secondary: #bcb6ae; --text-tertiary: #878179;
    --border-color: #2d2925; --border-primary: #3a352f;
    --accent: #5b93f8; --accent-soft: rgba(91, 147, 248, 0.14);
    --budget-ok: #22c55e; --budget-warn: #f59e0b; --budget-bad: #ef4444;
    --warning-bg: rgba(239, 68, 68, 0.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg-secondary: #141311; --bg-primary: #1c1a17; --bg-tertiary: #26231f;
  --text-primary: #f3f1ed; --text-secondary: #bcb6ae; --text-tertiary: #878179;
  --border-color: #2d2925; --border-primary: #3a352f;
  --accent: #5b93f8; --accent-soft: rgba(91, 147, 248, 0.14);
  --budget-ok: #22c55e; --budget-warn: #f59e0b; --budget-bad: #ef4444;
  --warning-bg: rgba(239, 68, 68, 0.14);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: clip; }
body {
  background: var(--bg-secondary);
  color: var(--text-primary);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }

.wrap { max-width: 880px; margin: 0 auto; padding: 18px 14px 56px; }
@media (min-width: 640px) { .wrap { padding: 26px 20px 60px; } }

.topbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.topbar h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.spacer { flex: 1; min-width: 8px; }
.who-tag {
  font-size: 13px; color: var(--text-secondary);
  display: inline-flex; align-items: center; gap: 6px;
}
.who-tag .hint-key {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px; color: var(--text-tertiary);
}

.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); }
.mono, code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12.5px; }
.tnum { font-variant-numeric: tabular-nums; }
.nowrap { white-space: nowrap; }

.card {
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 15px;
}
.card + .card { margin-top: 12px; }
@media (min-width: 640px) {
  .card { padding: 18px; }
  .card + .card { margin-top: 14px; }
}
.card-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.card-head h2 { font-size: 15px; margin: 0; font-weight: 600; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.input {
  padding: 9px 11px; border: 1px solid var(--border-primary);
  border-radius: 8px; background: var(--bg-secondary);
  color: var(--text-primary); min-width: 0; width: 100%;
}
.input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--border-primary); background: var(--bg-primary);
  border-radius: 8px; padding: 7px 13px; cursor: pointer;
  white-space: nowrap; font-size: 13.5px; line-height: 1.3;
  transition: background-color .12s, opacity .12s;
}
.btn:hover:not(:disabled) { background: var(--bg-tertiary); }
.btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { opacity: 0.92; background: var(--accent); }
.btn.small { padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.5; cursor: default; }

label.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text-secondary); cursor: pointer; user-select: none; }

.login-card { max-width: 480px; margin: 44px auto 0; }
.login-form { display: grid; gap: 10px; }
.login-row { display: flex; gap: 8px; }
.login-row .input { flex: 1; }

.notice {
  padding: 10px 12px; border-radius: 8px;
  background: var(--warning-bg); color: var(--text-primary);
  margin-bottom: 12px; font-size: 13.5px;
}

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--budget-ok); flex-shrink: 0; }
.status.bad::before { background: var(--budget-bad); }
.status.off::before { background: var(--text-tertiary); }

.budget-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
@media (min-width: 640px) {
  .budget-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
}
.budget-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 13px 14px;
  display: grid;
  gap: 6px;
}
.budget-label {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  font-size: 12.5px; color: var(--text-secondary);
}
.budget-rem { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.budget-val {
  font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em; line-height: 1.2;
  display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap;
}
.budget-val .denom { font-size: 13.5px; font-weight: 400; color: var(--text-tertiary); }
.bar { height: 6px; border-radius: 99px; background: var(--bg-tertiary); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 99px; transition: width .2s ease; }
.bar > span.ok { background: var(--budget-ok); }
.bar > span.warn { background: var(--budget-warn); }
.bar > span.bad { background: var(--budget-bad); }
.budget-meta { font-size: 12px; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }

.live-strip {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 10px;
}
.live-pill {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.live-pill .k { font-size: 12.5px; color: var(--text-secondary); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.live-pill .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.live-pill .v .denom { font-size: 12.5px; font-weight: 400; color: var(--text-tertiary); }

.live-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--text-tertiary); opacity: 0.45; flex-shrink: 0;
}
.live-dot.active {
  background: var(--budget-ok); opacity: 1;
  box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.55);
  animation: pulse-live 1.8s ease-out infinite;
}
@keyframes pulse-live {
  0% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0.55); }
  70% { box-shadow: 0 0 0 6px rgba(22, 163, 74, 0); }
  100% { box-shadow: 0 0 0 0 rgba(22, 163, 74, 0); }
}

.extra-limits {
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color);
  display: flex; flex-wrap: wrap; gap: 8px 16px;
  font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums;
}

.seg { display: inline-flex; border: 1px solid var(--border-primary); border-radius: 7px; overflow: hidden; background: var(--bg-secondary); }
.seg button { border: 0; background: transparent; padding: 3px 9px; cursor: pointer; color: var(--text-secondary); font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--border-color); }
.seg button[aria-pressed="true"] { background: var(--bg-tertiary); color: var(--text-primary); font-weight: 600; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: 185px; overflow: visible; }
.chart .grid { stroke: var(--border-color); stroke-width: 1; }
.chart .axis { fill: var(--text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }

.tip {
  position: fixed; pointer-events: none;
  background: var(--bg-secondary); border: 1px solid var(--border-primary);
  border-radius: 8px; padding: 7px 10px; font-size: 12px;
  display: none; z-index: 50; box-shadow: var(--shadow-lg);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

.table-scroll { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
th { color: var(--text-secondary); font-weight: 500; font-size: 12.5px; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
td.mono { white-space: nowrap; }
tr:last-child td { border-bottom: 0; }

.chip {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  background: var(--bg-tertiary); font-size: 12px;
  margin: 2px 4px 2px 0; white-space: nowrap;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

.setup-grid { display: grid; gap: 10px; }
.setup-item {
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 11px 12px;
  display: grid; gap: 8px;
}
.setup-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.setup-title { font-size: 13px; font-weight: 600; }
pre.code-block {
  margin: 0; padding: 8px 10px; border-radius: 7px;
  background: var(--bg-primary); border: 1px solid var(--border-color);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 12px; line-height: 1.55; overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  color: var(--text-primary);
}

.empty { padding: 20px 10px; text-align: center; color: var(--text-tertiary); font-size: 13.5px; }
.toast {
  position: fixed; right: 16px; bottom: 16px;
  background: var(--text-primary); color: var(--bg-secondary);
  padding: 8px 13px; border-radius: 9px; box-shadow: var(--shadow-lg);
  z-index: 60; display: none; font-size: 13px; max-width: 82vw;
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const STORE = "cpa-users:me-key";
const fmtCompact = new Intl.NumberFormat("zh-CN", { notation: "compact", maximumFractionDigits: 1 });
const fmtInt = new Intl.NumberFormat("zh-CN");
const $ = (sel, root = document) => root.querySelector(sel);

// ---------- safe DOM helpers (no innerHTML with data) ----------
function h(tag, props, ...children) {
  const el = document.createElement(tag);
  let deferredValue;
  if (props) {
    if ("type" in props && props.type !== undefined) el.setAttribute("type", String(props.type));
    for (const [k, v] of Object.entries(props)) {
      if (k === "type" || v === undefined || v === null || v === false) continue;
      if (k === "class" || k === "className") el.className = v;
      else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
      else if (k === "dataset" && typeof v === "object") {
        for (const [dk, dv] of Object.entries(v)) {
          if (dv !== undefined && dv !== null) el.dataset[dk] = String(dv);
        }
      } else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "value" && (tag === "input" || tag === "select" || tag === "textarea")) deferredValue = v;
      else if (k === "checked" || k === "disabled" || k === "required") el[k] = Boolean(v);
      else el.setAttribute(k, v === true ? "" : String(v));
    }
  }
  const append = (c) => {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) { for (const x of c) append(x); return; }
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  append(children);
  if (deferredValue !== undefined) el.value = String(deferredValue);
  return el;
}

const SVG_NS = "http://www.w3.org/2000/svg";
function setChildren(el, ...nodes) {
  const flat = [];
  const push = (c) => {
    if (c === undefined || c === null || c === false) return;
    if (Array.isArray(c)) { for (const x of c) push(x); return; }
    flat.push(c instanceof Node ? c : document.createTextNode(String(c)));
  };
  push(nodes);
  el.replaceChildren(...flat);
}

function svgEl(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      el.setAttribute(k, String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === undefined || c === null || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

// ---------- key storage: sessionStorage by default, localStorage only if user opts in ----------
function readStoredKey() {
  try {
    const s = sessionStorage.getItem(STORE);
    if (s) return { key: s, remembered: Boolean(localStorage.getItem(STORE)) };
    const l = localStorage.getItem(STORE);
    if (l) {
      sessionStorage.setItem(STORE, l);
      return { key: l, remembered: true };
    }
  } catch { /* ignore */ }
  return { key: "", remembered: false };
}

function saveStoredKey(key, remember) {
  try {
    if (key) {
      sessionStorage.setItem(STORE, key);
      if (remember) localStorage.setItem(STORE, key);
      else localStorage.removeItem(STORE);
    } else {
      sessionStorage.removeItem(STORE);
      localStorage.removeItem(STORE);
    }
  } catch { /* ignore */ }
}

function clearStoredKey() {
  saveStoredKey("", false);
}

// ---------- formatting ----------
let currentData = null;
let currentKey = "";
let currentRemember = false;
let chartMetric = "cost"; // "cost" | "tokens"

const currencySymbol = (d = currentData) => (d && (d.currency_symbol || d.config?.currency_symbol)) || "$";
const num = (n) => fmtCompact.format(Number(n) || 0);

function fmtMoney(v, sym = currencySymbol()) {
  const n = Number(v) || 0;
  if (n === 0) return `${sym}0.00`;
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  if (abs >= 1) return `${sign}${sym}${abs.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  return `${sign}${sym}${abs.toFixed(4)}`;
}

function fmtPriceCell(v, sym = currencySymbol()) {
  const n = Number(v) || 0;
  if (n <= 0) return "—";
  return fmtMoney(n, sym);
}

function fmtAxisCost(v, sym = currencySymbol()) {
  if (!v) return `${sym}0`;
  if (v >= 1000) return `${sym}${fmtCompact.format(v)}`;
  if (v >= 1) return `${sym}${Number.isInteger(v) ? v : v.toFixed(v < 10 ? 2 : 1)}`;
  // Ticks are round steps, so three significant digits keep neighbours distinct.
  return `${sym}${parseFloat(v.toPrecision(3))}`;
}

function budgetClass(pct) {
  if (pct > 90) return "bad";
  if (pct >= 70) return "warn";
  return "ok";
}

function globMatch(pattern, text) {
  const p = String(pattern || "").toLowerCase();
  const s = String(text || "").toLowerCase();
  if (!p) return false;
  if (p === "*") return true;
  if (!p.includes("*")) return p === s;
  const re = new RegExp("^" + p.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, ".*") + "$");
  return re.test(s);
}

function findPrice(prices, model) {
  if (!prices || !prices.length || !model) return null;
  const lower = model.toLowerCase();
  const exact = prices.find((r) => String(r.model || "").toLowerCase() === lower);
  if (exact) return exact;
  let best = null, bestScore = -1;
  for (const r of prices) {
    const p = String(r.model || "");
    if (p.includes("*") && globMatch(p, model)) {
      const score = p.replace(/\*/g, "").length;
      if (score > bestScore) { best = r; bestScore = score; }
    }
  }
  return best;
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.style.display = "none"; }, 2200);
}

async function copyText(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    toast(msg || "已复制");
  } catch {
    prompt("复制下面的内容", text);
  }
}

// ---------- data fetch ----------
// Each fetch takes a ticket; logging out or starting a newer fetch voids older
// tickets so a late response cannot store the key again or re-render.
let fetchTicket = 0;

async function fetchMe(key, remember) {
  const ticket = ++fetchTicket;
  const app = $("#app");
  if (!currentData) {
    app.replaceChildren(
      h("div", { class: "topbar" }, h("h1", null, "我的用量")),
      h("div", { class: "card muted" }, "查询中…")
    );
  }
  let res, data = {};
  try {
    res = await fetch("me/data", {
      headers: { Authorization: `Bearer ${key}` },
      cache: "no-store",
    });
    data = await res.json();
  } catch {
    if (ticket !== fetchTicket) return;
    renderLogin("网络错误，请稍后再试。", remember);
    return;
  }
  if (ticket !== fetchTicket) return;
  if (!res.ok) {
    if (res.status === 401) clearStoredKey();
    currentData = null;
    currentKey = "";
    renderLogin(data.error || "API Key 无效或查询失败", remember);
    return;
  }
  currentKey = key;
  currentRemember = remember;
  currentData = data;
  saveStoredKey(key, remember);
  renderDashboard(data);
}

// ---------- login view ----------
function renderLogin(errorMsg = "", remember = currentRemember) {
  const app = $("#app");
  const keyIn = h("input", {
    class: "input",
    type: "password",
    placeholder: "粘贴你的 API Key（sk-cu-…）",
    autocomplete: "off",
    required: true
  });
  const remIn = h("input", { type: "checkbox", checked: Boolean(remember) });

  const form = h("form", {
    class: "login-form",
    autocomplete: "off",
    onSubmit: (e) => {
      e.preventDefault();
      const k = keyIn.value.trim();
      if (k) fetchMe(k, remIn.checked);
    }
  },
    h("div", { class: "login-row" },
      keyIn,
      h("button", { class: "btn primary", type: "submit" }, "查询")
    ),
    h("div", { class: "row", style: { justifyContent: "space-between" } },
      h("label", { class: "check" }, remIn, "记住此设备"),
      h("span", { class: "faint", style: { fontSize: "12px" } }, "默认仅在当前标签页有效")
    )
  );

  app.replaceChildren(
    h("section", { class: "card login-card" },
      h("div", { class: "card-head" }, h("h2", { style: { fontSize: "18px" } }, "我的用量")),
      h("p", { class: "muted", style: { marginTop: "0", fontSize: "13.5px" } },
        "输入管理员发给你的 API Key，查看消费金额、剩余额度、实时并发与可用模型单价。"
      ),
      errorMsg ? h("div", { class: "notice" }, errorMsg) : null,
      form
    )
  );
}

// ---------- dashboard view ----------
function budgetCard(label, spent, limit, metaText) {
  const s = Number(spent) || 0;
  const lim = Number(limit) || 0;
  const pct = lim > 0 ? Math.min(100, (s / lim) * 100) : 0;
  const rem = lim > 0 ? Math.max(0, lim - s) : 0;

  return h("div", { class: "budget-box" },
    h("div", { class: "budget-label" },
      h("span", null, label),
      lim > 0 ? h("span", { class: "budget-rem" }, `余 ${fmtMoney(rem)}`) : h("span", { class: "budget-rem" }, "不限")
    ),
    h("div", { class: "budget-val" },
      fmtMoney(s),
      h("span", { class: "denom" }, `/ ${lim > 0 ? fmtMoney(lim) : "—"}`)
    ),
    lim > 0
      ? h("div", { class: "bar" }, h("span", { class: budgetClass(pct), style: { width: `${pct.toFixed(1)}%` } }))
      : null,
    metaText ? h("div", { class: "budget-meta" }, metaText) : null
  );
}

function renderDashboard(d) {
  const app = $("#app");
  const u = d.user || {};
  const q = d.quota || {};
  const day = q.day || {};
  const month = q.month || {};
  const keyInfo = d.key || {};
  const blocked = u.blocked || (keyInfo.disabled ? "该 Key 已停用" : "");
  const sym = currencySymbol(d);

  // Top bar (never echo full key; show hint only)
  const keyDisplay = keyInfo.name ? `${keyInfo.name} (${keyInfo.hint || ""})` : (keyInfo.hint || "");
  const topbar = h("header", { class: "topbar" },
    h("h1", null, "我的用量"),
    h("span", { class: "who-tag" },
      u.name || "",
      keyDisplay ? h("span", { class: "hint-key" }, keyDisplay) : null
    ),
    h("span", { class: "spacer" }),
    h("button", {
      class: "btn small",
      type: "button",
      onClick: () => { if (currentKey) fetchMe(currentKey, currentRemember); }
    }, "刷新"),
    h("button", {
      class: "btn small",
      type: "button",
      onClick: () => {
        fetchTicket++;
        clearStoredKey();
        currentKey = "";
        currentData = null;
        currentRemember = false;
        renderLogin("", false);
      }
    }, "退出")
  );

  // Expiry & status
  const isExpired = Boolean(u.expires_at && u.expires_at * 1000 <= Date.now());
  const statusEl = blocked
    ? h("span", { class: "status bad" }, "不可用")
    : isExpired
      ? h("span", { class: "status bad" }, "已过期")
      : u.disabled
        ? h("span", { class: "status off" }, "已停用")
        : h("span", { class: "status" }, "正常");

  const expiryText = u.expires_at
    ? `有效期至 ${new Date(u.expires_at * 1000 - 1).toLocaleDateString("zh-CN")}`
    : "永久有效";

  const dayMeta = [
    `${num(day.tokens)} Token · ${fmtInt.format(day.requests || 0)} 次`,
    q.day_reset ? `重置 ${new Date(q.day_reset * 1000).toLocaleTimeString("zh-CN", { hour12: false, hour: "2-digit", minute: "2-digit" })}` : ""
  ].filter(Boolean).join(" · ");

  const monthMeta = [
    `${num(month.tokens)} Token · ${fmtInt.format(month.requests || 0)} 次`,
    q.month_reset ? `重置 ${new Date(q.month_reset * 1000).toLocaleDateString("zh-CN")}` : ""
  ].filter(Boolean).join(" · ");

  // Optional secondary token/request limits if configured
  const extraParts = [];
  if (u.daily_tokens > 0) extraParts.push(`日 Token：${num(day.tokens)} / ${num(u.daily_tokens)}`);
  if (u.monthly_tokens > 0) extraParts.push(`月 Token：${num(month.tokens)} / ${num(u.monthly_tokens)}`);
  if (u.daily_requests > 0) extraParts.push(`日请求：${fmtInt.format(day.requests || 0)} / ${fmtInt.format(u.daily_requests)}`);
  if (u.monthly_requests > 0) extraParts.push(`月请求：${fmtInt.format(month.requests || 0)} / ${fmtInt.format(u.monthly_requests)}`);

  const running = q.running || 0;
  const rpm = q.rpm || 0;

  const heroCard = h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("h2", null, "消费与额度"),
      statusEl,
      h("span", { class: "spacer" }),
      h("span", { class: "faint", style: { fontSize: "12.5px" } }, expiryText)
    ),
    h("div", { class: "budget-grid" },
      budgetCard("今日消费", day.cost || 0, u.daily_cost_limit || 0, dayMeta),
      budgetCard("本月消费", month.cost || 0, u.monthly_cost_limit || 0, monthMeta),
      budgetCard("累计消费", q.total_cost || 0, u.total_cost_limit || 0, "历史累计等价费用")
    ),
    h("div", { class: "live-strip" },
      h("div", { class: "live-pill" },
        h("span", { class: "k" },
          h("span", { class: "live-dot" + (running > 0 ? " active" : "") }),
          "当前并发"
        ),
        h("span", { class: "v" },
          String(running),
          h("span", { class: "denom" }, ` / ${u.max_concurrency > 0 ? u.max_concurrency : "—"}`)
        )
      ),
      h("div", { class: "live-pill" },
        h("span", { class: "k" }, "RPM"),
        h("span", { class: "v" },
          fmtInt.format(rpm),
          h("span", { class: "denom" }, ` / ${u.rpm_limit > 0 ? fmtInt.format(u.rpm_limit) : "—"}`)
        )
      )
    ),
    extraParts.length
      ? h("div", { class: "extra-limits" }, extraParts.map((p) => h("span", null, p)))
      : null
  );

  // 14-day spend chart card
  const metricSeg = h("span", { class: "seg" },
    [["cost", "金额"], ["tokens", "Token"]].map(([k, label]) =>
      h("button", {
        type: "button",
        "aria-pressed": String(chartMetric === k),
        onClick: () => { chartMetric = k; renderDashboard(d); }
      }, label)
    )
  );
  const chartCard = h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("h2", null, chartMetric === "cost" ? "最近 14 天消费" : "最近 14 天 Token"),
      h("span", { class: "spacer" }),
      metricSeg
    ),
    h("div", { class: "chart", id: "chart" })
  );

  // Available models + prices card
  const modelsCard = h("section", { class: "card" },
    h("div", { class: "card-head" },
      h("h2", null, "可用模型与价格"),
      h("span", { class: "faint", style: { fontSize: "12.5px" } }, `单位：${sym} / 1M Token`)
    ),
    buildModelsSection(d, sym)
  );

  // Recent requests card (strictly NO error bodies!)
  const logsCard = h("section", { class: "card" },
    h("div", { class: "card-head" }, h("h2", null, "最近请求")),
    buildLogsTable(d.logs || [], sym)
  );

  // Setup / connection guide card (never echoes full key)
  const base = location.origin;
  const openaiBase = `${base}/v1`;
  const claudeEnv = `export ANTHROPIC_BASE_URL="${base}"\nexport ANTHROPIC_AUTH_TOKEN="<你的 API Key>"`;

  const setupCard = h("section", { class: "card" },
    h("div", { class: "card-head" }, h("h2", null, "接入方式")),
    h("div", { class: "setup-grid" },
      h("div", { class: "setup-item" },
        h("div", { class: "setup-head" },
          h("span", { class: "setup-title" }, "OpenAI 兼容客户端"),
          h("button", {
            class: "btn small",
            type: "button",
            onClick: () => copyText(openaiBase, "Base URL 已复制")
          }, "复制 Base URL")
        ),
        h("pre", { class: "code-block" }, `Base URL: ${openaiBase}\nAPI Key:  <你的 API Key>`)
      ),
      h("div", { class: "setup-item" },
        h("div", { class: "setup-head" },
          h("span", { class: "setup-title" }, "Claude Code 环境变量"),
          h("button", {
            class: "btn small",
            type: "button",
            onClick: () => copyText(claudeEnv, "环境变量模板已复制")
          }, "复制配置")
        ),
        h("pre", { class: "code-block" }, claudeEnv)
      )
    ),
    h("p", { class: "faint", style: { fontSize: "12.5px", margin: "10px 0 0" } },
      "超出额度或速率限制会返回 429，调用无权限的模型会返回 403。"
    )
  );

  setChildren(app,
    topbar,
    blocked ? h("div", { class: "notice" }, blocked) : null,
    heroCard,
    chartCard,
    modelsCard,
    logsCard,
    setupCard
  );

  drawChart(d.usage || { days: [], daily: [] }, sym);
}

function buildModelsSection(d, sym) {
  const available = d.available || [];
  const prices = d.prices || [];
  const patterns = d.patterns || [];

  const nodes = [];

  if (available.length) {
    const rows = available.map((m) => {
      const p = findPrice(prices, m);
      return h("tr", null,
        h("td", { class: "mono" }, m),
        h("td", { class: "num nowrap" }, p ? fmtPriceCell(p.input, sym) : "—"),
        h("td", { class: "num nowrap" }, p ? fmtPriceCell(p.cached, sym) : "—"),
        h("td", { class: "num nowrap" }, p ? fmtPriceCell(p.output, sym) : "—"),
        h("td", { class: "num nowrap" }, p ? fmtPriceCell(p.per_request, sym) : "—")
      );
    });
    nodes.push(h("div", { class: "table-scroll" },
      h("table", null,
        h("thead", null,
          h("tr", null,
            h("th", null, "模型"),
            h("th", { class: "num" }, "输入"),
            h("th", { class: "num" }, "缓存"),
            h("th", { class: "num" }, "输出"),
            h("th", { class: "num" }, "按次")
          )
        ),
        h("tbody", null, rows)
      )
    ));
  } else if (prices.length) {
    const rows = prices.map((p) =>
      h("tr", null,
        h("td", { class: "mono" }, p.model || "—"),
        h("td", { class: "num nowrap" }, fmtPriceCell(p.input, sym)),
        h("td", { class: "num nowrap" }, fmtPriceCell(p.cached, sym)),
        h("td", { class: "num nowrap" }, fmtPriceCell(p.output, sym)),
        h("td", { class: "num nowrap" }, fmtPriceCell(p.per_request, sym))
      )
    );
    nodes.push(h("div", { class: "table-scroll" },
      h("table", null,
        h("thead", null,
          h("tr", null,
            h("th", null, "模型规则"),
            h("th", { class: "num" }, "输入"),
            h("th", { class: "num" }, "缓存"),
            h("th", { class: "num" }, "输出"),
            h("th", { class: "num" }, "按次")
          )
        ),
        h("tbody", null, rows)
      )
    ));
  } else {
    nodes.push(h("div", { class: "empty" }, "暂无已知可用模型。"));
  }

  if (patterns.some((p) => p.includes("*"))) {
    nodes.push(h("div", { class: "faint", style: { fontSize: "12.5px", marginTop: "10px" } },
      "允许规则：",
      patterns.map((p) => h("span", { class: "chip" }, p))
    ));
  }

  return h("div", null, nodes);
}

function buildLogsTable(logs, sym) {
  if (!logs.length) return h("div", { class: "empty" }, "还没有请求记录。");
  return h("div", { class: "table-scroll" },
    h("table", null,
      h("thead", null,
        h("tr", null,
          h("th", null, "时间"),
          h("th", null, "模型"),
          h("th", { class: "num" }, "Token"),
          h("th", { class: "num" }, "金额"),
          h("th", null, "状态")
        )
      ),
      h("tbody", null,
        logs.map((l) => {
          const totalTok = (l.input_tokens || 0) + (l.output_tokens || 0);
          return h("tr", null,
            h("td", { class: "nowrap", style: { fontSize: "12.5px" } },
              new Date(l.ts * 1000).toLocaleString("zh-CN", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
            ),
            h("td", { class: "mono" }, l.model || "—"),
            h("td", {
              class: "num nowrap",
              title: `输入 ${fmtInt.format(l.input_tokens || 0)} · 输出 ${fmtInt.format(l.output_tokens || 0)}`
            }, num(totalTok)),
            h("td", { class: "num nowrap", style: { fontWeight: "500" } }, fmtMoney(l.cost || 0, sym)),
            h("td", { class: "nowrap" },
              l.failed
                ? h("span", { class: "status bad" }, String(l.status || "失败"))
                : h("span", { class: "status" }, String(l.status || 200))
            )
          );
        })
      )
    )
  );
}

// ---------- 14-day spend chart (inline SVG via svgEl) ----------
function drawChart(usage, sym) {
  const host = $("#chart");
  if (!host) return;
  const days = usage.days || [];
  const daily = usage.daily || [];
  const vals = days.map((_, i) => {
    const row = daily[i] || {};
    return chartMetric === "cost" ? (Number(row.cost) || 0) : (Number(row.total_tokens) || 0);
  });
  const max = Math.max(...vals, 0);
  if (!max) {
    host.replaceChildren(h("div", { class: "empty" },
      chartMetric === "cost" ? "最近 14 天暂无消费记录。" : "最近 14 天暂无 Token 用量。"
    ));
    return;
  }

  const W = Math.max(host.clientWidth || 0, 290);
  const H = 185, padL = 52, padR = 8, padT = 8, padB = 22;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const raw = max / 3;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  const tickCount = Math.max(1, Math.ceil(max / step));
  const top = tickCount * step;
  const n = vals.length, slot = plotW / n, bw = Math.max(4, Math.min(26, slot * 0.58));
  const y = (v) => padT + plotH - (v / top) * plotH;

  const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": chartMetric === "cost" ? "最近 14 天消费" : "最近 14 天 Token" });

  for (let t = 0; t <= tickCount; t++) {
    const v = t * step;
    const yp = y(v);
    svg.appendChild(svgEl("line", { class: "grid", x1: padL, x2: W - padR, y1: yp, y2: yp }));
    svg.appendChild(svgEl("text", { class: "axis", x: padL - 6, y: yp + 4, "text-anchor": "end" },
      chartMetric === "cost" ? fmtAxisCost(v, sym) : num(v)
    ));
  }

  const every = Math.ceil(n / Math.max(1, Math.floor(plotW / 54)));
  vals.forEach((v, i) => {
    const cx = padL + slot * i + slot / 2;
    const isLast = i === n - 1;
    const showTick = isLast || (i % every === 0 && (n - 1 - i) >= Math.ceil(every * 0.6));
    if (showTick) {
      svg.appendChild(svgEl("text", { class: "axis", x: cx, y: H - 5, "text-anchor": "middle" }, (days[i] || "").slice(5)));
    }
    if (v > 0) {
      const x = cx - bw / 2, yt = y(v), bh = Math.max(1, padT + plotH - yt), r = Math.min(4, bw / 2, bh);
      const path = svgEl("path", {
        fill: "var(--accent)",
        d: `M${x},${yt + bh}V${yt + r}Q${x},${yt} ${x + r},${yt}H${x + bw - r}Q${x + bw},${yt} ${x + bw},${yt + r}V${yt + bh}Z`
      });
      path.style.pointerEvents = "none";
      svg.appendChild(path);
    }
    svg.appendChild(svgEl("rect", {
      x: padL + slot * i, y: padT, width: slot, height: plotH,
      fill: "transparent", "data-i": i
    }));
  });

  host.replaceChildren(svg);

  const tip = $("#tip");
  const showTip = (clientX, clientY, target) => {
    const t = target && target.closest ? target.closest("[data-i]") : null;
    if (!t) { tip.style.display = "none"; return; }
    const i = Number(t.dataset.i);
    const day = daily[i] || {};
    tip.replaceChildren(
      h("div", { class: "muted", style: { marginBottom: "2px" } }, days[i] || ""),
      h("div", null, h("strong", null, fmtMoney(day.cost || 0, sym))),
      h("div", { class: "faint" }, `${fmtInt.format(day.total_tokens || 0)} Token · ${fmtInt.format(day.requests || 0)} 次请求`)
    );
    tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    let left = clientX + 12, topPx = clientY + 14;
    if (left + r.width > innerWidth - 8) left = clientX - r.width - 12;
    if (topPx + r.height > innerHeight - 8) topPx = clientY - r.height - 12;
    tip.style.left = `${Math.max(8, left)}px`;
    tip.style.top = `${Math.max(8, topPx)}px`;
  };

  host.onmousemove = (e) => showTip(e.clientX, e.clientY, e.target);
  host.onmouseleave = () => { tip.style.display = "none"; };
  host.onclick = (e) => showTip(e.clientX, e.clientY, e.target);
}

window.addEventListener("resize", () => {
  if (currentData) drawChart(currentData.usage || { days: [], daily: [] }, currencySymbol(currentData));
});

// ---------- startup ----------
const saved = readStoredKey();
if (saved.key) {
  fetchMe(saved.key, saved.remembered);
} else {
  renderLogin("", false);
}
})();
</script>
</body>
</html>
