name: release

# Pushing a tag such as v0.1.0 builds the plugin for each platform and publishes a
# GitHub release in the layout CLIProxyAPI's plugin store installs from:
#   cpa-users_<version>_<goos>_<goarch>.zip  (cpa-users.<ext> at the zip root)
#   checksums.txt                             (sha256 of every zip)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -count=1 ./...

  linux:
    needs: test
    runs-on: ubuntu-latest
    # Debian bullseye (glibc 2.31) keeps the library loadable on older hosts.
    container: golang:1.24-bullseye
    strategy:
      matrix:
        include:
          - goarch: amd64
            cc: gcc
            cflags: -march=x86-64
          - goarch: arm64
            cc: aarch64-linux-gnu-gcc
            cflags: -march=armv8-a
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends zip
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          fi
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cflags }}
          GOAMD64: v1
          GOARM64: v8.0
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -buildvcs=false -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.PluginVersion=${VERSION}" -o cpa-users.so .
          zip "cpa-users_${VERSION}_linux_${{ matrix.goarch }}.zip" cpa-users.so
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: "*.zip"

  darwin:
    needs: test
    runs-on: macos-14
    strategy:
      matrix:
        goarch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.goarch }}" = "amd64" ]; then export CC="clang -arch x86_64"; fi
          go build -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.PluginVersion=${VERSION}" -o cpa-users.dylib .
          zip "cpa-users_${VERSION}_darwin_${{ matrix.goarch }}.zip" cpa-users.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-${{ matrix.goarch }}
          path: "*.zip"

  release:
    needs: [linux, darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt
          gh release create "$GITHUB_REF_NAME" *.zip checksums.txt \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Install from Oh My CPA or CPAMC: add https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/registry.json as a plugin store source, then install cpa-users."
